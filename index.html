steps":["Fleisch würzen und in den Ofenmeister legen.","Mit Apfelsaft angießen.","Langsam garen bis es zerfällt.","Zerpflücken und mit BBQ Sauce mischen."]},{"id":903,"product":"lilly","title":"Curryreis aus der Lilly","category":"Beilage","time":"35 Min","temp":"200°C","portions":"2–3","ingredients":["200 g Reis","400 ml Brühe","100 ml Kokosmilch","1 TL Curry","Gemüse nach Wahl"],"steps":["Alles in die Lilly geben.","Mit Deckel garen.","Vor dem Servieren umrühren."]},{"id":904,"product":"ofenzauberer","title":"Pizzabrötchen vom James","category":"Snack","time":"20 Min","temp":"220°C","portions":"12 Stück","ingredients":["Brötchenteig","Tomatensauce","Käse","Salami oder Gemüse"],"steps":["Teig füllen und formen.","Auf dem James verteilen.","Goldbraun backen."]},{"id":1201,"product":"lilly","title":"Rustikales Sauerteig-Krustenbrot","category":"Brot","time":"65 Min (+ ca. 17 Std Reife)","temp":"250°C → 220°C","portions":"1 Brot","ingredients":["100 g aktives Anstellgut (Weizen)","300 g Weizenmehl Type 550","100 g Roggenmehl Type 1150","50 g Weizenvollkornmehl","300 g Wasser, lauwarm","10 g Salz"],"steps":["Anstellgut, Mehle und Wasser grob verkneten und 30 Minuten quellen lassen.","Salz zugeben und 8–10 Minuten kneten, bis der Teig glatt ist.","Stockgare ca. 5 Stunden, in der ersten Stunde dreimal dehnen und falten.","Rundwirken, ins bemehlte Körbchen geben und über Nacht in den Kühlschrank stellen.","In den gefetteten, bemehlten Topf stürzen und einschneiden.","Mit Deckel in den kalten Ofen: 50 Minuten bei 250°C, dann 10–15 Minuten ohne Deckel bei 220°C. Auf einem Gitter auskühlen lassen."]},{"id":1202,"product":"lilly","title":"Schnelles Dinkel-Joghurt-Brot","category":"Brot","time":"60 Min (+ 60 Min Gehzeit)","temp":"200°C","portions":"1 Brot","ingredients":["450 g Dinkelmehl Type 630","1 Pck. Trockenhefe (7 g)","250 g Naturjoghurt","100 g Wasser, lauwarm","10 g Salz","1 TL Honig"],"steps":["Alle Zutaten 5 Minuten zu einem geschmeidigen Teig verkneten.","Abgedeckt 60 Minuten gehen lassen, bis sich das Volumen sichtbar vergrößert.","Topf fetten, Teig zum Laib formen, hineinlegen und einschneiden.","Mit Deckel in den kalten Ofen, 50 Minuten bei 200°C.","Deckel abnehmen und weitere 10 Minuten goldbraun backen.","Auf einem Gitter auskühlen lassen."]},{"id":1203,"product":"lilly","title":"Karotten-Walnuss-Krustenbrot","category":"Brot","time":"60 Min (+ ca. 14 Std Reife)","temp":"240°C → 210°C","portions":"1 Brot","ingredients":["100 g aktives Anstellgut (Weizen)","350 g Weizenmehl Type 1050","100 g Dinkelvollkornmehl","150 g Karotten, fein geraspelt","50 g Walnüsse, gehackt","240 g Wasser, lauwarm","10 g Salz"],"steps":["Anstellgut, Mehle und Wasser verkneten und 30 Minuten quellen lassen.","Salz zugeben, kneten, dann Karotten und Walnüsse einarbeiten.","Stockgare 4–5 Stunden, zweimal dehnen und falten.","Formen, ins Körbchen geben und über Nacht in den Kühlschrank stellen.","In den gefetteten Topf stürzen und einschneiden.","Mit Deckel in den kalten Ofen: 45 Minuten bei 240°C, dann 12–15 Minuten ohne Deckel bei 210°C."]},{"id":1204,"product":"lilly","title":"Kräftiges Roggen-Mischbrot","category":"Brot","time":"65 Min (+ ca. 4 Std Reife)","temp":"250°C → 220°C","portions":"1 Brot","ingredients":["120 g aktives Anstellgut (Roggen)","250 g Roggenmehl Type 1150","180 g Weizenmehl Type 1050","320 g Wasser, lauwarm","11 g Salz","1 TL Brotgewürz, gemahlen"],"steps":["Alle Zutaten zu einem klebrigen Teig verrühren – Roggen braucht kein langes Kneten.","2–3 Stunden gehen lassen, bis sich Blasen zeigen.","Mit nassen Händen in den gefetteten, bemehlten Topf streichen.","Mit Mehl bestäuben und ca. 1 Stunde reifen, bis die Oberfläche aufreißt.","Mit Deckel in den kalten Ofen: 50 Minuten bei 250°C, dann 15 Minuten ohne Deckel bei 220°C.","Auf einem Gitter auskühlen lassen."]},{"id":1205,"product":"lilly","title":"Schnelles Bierbrot","category":"Brot","time":"55 Min","temp":"200°C","portions":"1 Brot","ingredients":["400 g Weizenmehl Type 550","1 Pck. Backpulver","330 ml Bier","8 g Salz","1 TL Zucker","Nach Wunsch: Saaten obenauf"],"steps":["Mehl, Backpulver, Salz und Zucker mischen.","Bier zugießen und nur kurz verrühren – nicht kneten.","Teig in den gefetteten Topf geben und glattstreichen.","Mit Deckel in den kalten Ofen, 45 Minuten bei 200°C.","Deckel abnehmen und weitere 10 Minuten backen.","Auf einem Gitter auskühlen lassen."]},{"id":1206,"product":"lilly","title":"Saftiges Körner-Saatenbrot","category":"Brot","time":"60 Min (+ 60 Min Gehzeit)","temp":"220°C","portions":"1 Brot","ingredients":["300 g Weizenmehl Type 1050","100 g Roggenmehl Type 1150","1 Pck. Trockenhefe (7 g)","320 g Wasser, lauwarm","10 g Salz","100 g Saatenmix (Sonnenblume, Kürbis, Lein, Sesam)"],"steps":["Saaten kurz in einer Pfanne ohne Fett anrösten und etwas abkühlen lassen.","Mehle, Hefe, Wasser und Salz verkneten, dann Saaten unterarbeiten.","Abgedeckt 60 Minuten gehen lassen.","Zum Laib formen, in den gefetteten Topf geben, einschneiden und mit Saaten bestreuen.","Mit Deckel in den kalten Ofen, 50 Minuten bei 220°C.","Deckel abnehmen und 10 Minuten fertig backen. Auskühlen lassen."]},{"id":1207,"product":"lilly","title":"Saftiger Hefezopf","category":"Frühstück","time":"35 Min (+ 80 Min Gehzeit)","temp":"175°C","portions":"1 Zopf","ingredients":["400 g Weizenmehl Type 550","1 Pck. Trockenhefe (7 g)","180 ml Milch, lauwarm","60 g weiche Butter","60 g Zucker","1 Ei","Eigelb & Hagelzucker zum Bestreichen"],"steps":["Alle Zutaten 8 Minuten zu einem geschmeidigen Teig kneten und 60 Minuten gehen lassen.","In drei Stränge teilen und einen Zopf flechten.","Zopf in den gefetteten Topf legen und 20 Minuten ruhen lassen.","Mit verquirltem Eigelb bestreichen und mit Hagelzucker bestreuen.","Ohne Deckel in den kalten Ofen, 35 Minuten bei 175°C goldbraun backen.","Im Topf kurz ruhen, dann auf einem Gitter auskühlen lassen."]},{"id":1208,"product":"lilly","title":"Zimt-Rosinen-Brot","category":"Frühstück","time":"35 Min (+ 80 Min Gehzeit)","temp":"180°C","portions":"1 Brot","ingredients":["400 g Weizenmehl Type 550","1 Pck. Trockenhefe (7 g)","200 ml Milch, lauwarm","40 g weiche Butter","50 g Zucker","100 g Rosinen","2 TL Zimt"],"steps":["Rosinen kurz in warmem Wasser einweichen und abtropfen lassen.","Mehl, Hefe, Milch, Butter, Zucker und eine Prise Salz kneten.","Rosinen und Zimt unterarbeiten und 60 Minuten gehen lassen.","Zum Laib formen, in den gefetteten Topf geben und 20 Minuten ruhen lassen.","Ohne Deckel in den kalten Ofen, 35 Minuten bei 180°C.","Auf einem Gitter auskühlen lassen."]},{"id":1209,"product":"lilly","title":"Baked Oatmeal mit Beeren","category":"Frühstück","time":"40 Min","temp":"180°C","portions":"3–4","ingredients":["200 g Haferflocken","350 ml Milch","2 Eier","1 reife Banane","40 g Ahornsirup oder Honig","1 TL Backpulver","150 g Beeren (auch TK)"],"steps":["Banane zerdrücken und mit Eiern, Milch und Sirup verrühren.","Haferflocken, Backpulver, etwas Zimt und eine Prise Salz unterrühren.","Die Hälfte der Beeren unterheben.","Masse in den gefetteten Topf geben und die restlichen Beeren daraufsetzen.","Ohne Deckel in den kalten Ofen, 40 Minuten bei 180°C.","Warm mit Joghurt servieren."]},{"id":1210,"product":"lilly","title":"Fluffiger Quark-Stuten","category":"Frühstück","time":"35 Min (+ 80 Min Gehzeit)","temp":"180°C","portions":"1 Stuten","ingredients":["350 g Weizenmehl Type 550","1 Pck. Trockenhefe (7 g)","150 g Magerquark","80 ml Milch, lauwarm","40 g weiche Butter","40 g Zucker","1 Ei"],"steps":["Alle Zutaten mit einer Prise Salz 8 Minuten kneten.","60 Minuten gehen lassen, bis sich der Teig verdoppelt.","Zum Laib formen, in den gefetteten Topf geben und 20 Minuten ruhen lassen.","Nach Wunsch einschneiden und mit Milch bestreichen.","Ohne Deckel in den kalten Ofen, 35 Minuten bei 180°C.","Auf einem Gitter auskühlen lassen."]},{"id":1211,"product":"lilly","title":"Kräuter-Käse-Zupfbrot","category":"Snack","time":"35 Min (+ 65 Min Gehzeit)","temp":"180°C","portions":"1 Topf","ingredients":["400 g Weizenmehl Type 550","1 Pck. Trockenhefe (7 g)","230 g Milch, lauwarm","40 g weiche Butter","8 g Salz","Für die Füllung: 70 g weiche Kräuterbutter","100 g geriebener Käse"],"steps":["Mehl, Hefe, Milch, Butter und Salz 8 Minuten kneten und 45 Minuten gehen lassen.","Teig dünn rechteckig ausrollen und mit Kräuterbutter bestreichen.","In Quadrate schneiden und aufeinanderstapeln.","Hochkant in den gefetteten Topf setzen und mit dem halben Käse bestreuen.","20 Minuten gehen lassen, dann den restlichen Käse darübergeben.","Ohne Deckel 35 Minuten bei 180°C backen. Lauwarm servieren."]},{"id":1212,"product":"lilly","title":"Rosmarin-Focaccia","category":"Snack","time":"28 Min (+ 80 Min Gehzeit)","temp":"220°C","portions":"1 Topf","ingredients":["300 g Weizenmehl Type 550","1/2 Pck. Trockenhefe (5 g)","210 g Wasser, lauwarm","30 g Olivenöl","6 g Salz","Belag: Olivenöl, Rosmarin, Meersalz"],"steps":["Alle Zutaten zu einem weichen Teig verkneten und 60 Minuten gehen lassen.","Topf großzügig mit Olivenöl ausstreichen und den Teig flach hineindrücken.","Mit öligen Fingern die typischen Dellen eindrücken.","Mit Olivenöl, Rosmarin und Meersalz belegen und 20 Minuten ruhen lassen.","Ohne Deckel in den kalten Ofen, 28 Minuten bei 220°C goldbraun backen.","Lauwarm in Stücke schneiden."]},{"id":1213,"product":"lilly","title":"Knusprige Ofenkartoffeln","category":"Beilage","time":"40 Min","temp":"220°C","portions":"2–3","ingredients":["600 g festkochende Kartoffeln","3 EL Olivenöl","1 TL Paprikapulver","1 Zweig Rosmarin","1 Knoblauchzehe","Salz, Pfeffer"],"steps":["Kartoffeln in Spalten schneiden.","Mit Öl, gepresstem Knoblauch und Gewürzen vermengen.","In den Topf geben.","Ohne Deckel in den kalten Ofen, 40 Minuten bei 220°C.","Nach 25 Minuten einmal wenden.","Heiß mit Kräuterquark servieren."]},{"id":1214,"product":"lilly","title":"Deftige Gulaschsuppe","category":"Suppe","time":"90 Min","temp":"180°C","portions":"3–4","ingredients":["300 g Rindergulasch","2 Zwiebeln","2 Paprika","200 g Kartoffeln","2 EL Tomatenmark","2 EL Paprikapulver","700 ml Brühe","Kümmel, Majoran, Knoblauch"],"steps":["Fleisch, gewürfelte Zwiebeln, Paprika und Kartoffeln in den Topf geben.","Tomatenmark, Gewürze und Brühe zugeben und gut vermengen.","Mit Deckel in den kalten Ofen.","90 Minuten bei 180°C schmoren lassen.","Nach der Hälfte einmal umrühren.","Mit Salz und Pfeffer abschmecken."]},{"id":1215,"product":"lilly","title":"Cremige Kartoffelsuppe","category":"Suppe","time":"60 Min","temp":"180°C","portions":"3–4","ingredients":["500 g Kartoffeln","2 Möhren","1 Stange Lauch","100 g Knollensellerie","700 ml Brühe","100 ml Sahne","Majoran, Salz, Pfeffer"],"steps":["Gemüse würfeln und in den Topf geben.","Mit Brühe und Majoran auffüllen.","Mit Deckel in den kalten Ofen, 60 Minuten bei 180°C.","Etwa die Hälfte fein pürieren, den Rest stückig lassen.","Sahne unterrühren und abschmecken.","Mit frischer Petersilie servieren."]},{"id":1216,"product":"lilly","title":"Samtige Kürbissuppe","category":"Suppe","time":"50 Min","temp":"190°C","portions":"3–4","ingredients":["600 g Hokkaido-Kürbis","1 Zwiebel","1 Möhre","1 Stück frischer Ingwer","200 ml Kokosmilch","500 ml Brühe","Currypulver, Salz, Pfeffer"],"steps":["Kürbis (mit Schale), Zwiebel, Möhre und Ingwer würfeln.","Mit Brühe und Curry in den Topf geben.","Mit Deckel in den kalten Ofen, 50 Minuten bei 190°C.","Fein pürieren.","Kokosmilch unterrühren und kurz durchziehen lassen.","Mit gerösteten Kürbiskernen servieren."]},{"id":1217,"product":"lilly","title":"Herzhafter Linseneintopf","category":"Eintopf","time":"75 Min","temp":"180°C","portions":"3–4","ingredients":["200 g Tellerlinsen","2 Möhren","200 g Kartoffeln","1 Zwiebel","1 EL Tomatenmark","700 ml Brühe","Lorbeer, Essig, Salz, Pfeffer"],"steps":["Gemüse würfeln und mit den Linsen in den Topf geben.","Tomatenmark, Lorbeer und Brühe zufügen.","Mit Deckel in den kalten Ofen, 75 Minuten bei 180°C.","Nach der Hälfte umrühren, bei Bedarf Brühe nachgießen.","Mit einem Schuss Essig abschmecken.","Nach Wunsch mit Würstchen servieren."]},{"id":1218,"product":"lilly","title":"Hähnchen-Gemüse-Schmortopf","category":"Geflügel","time":"60 Min","temp":"200°C","portions":"2–3","ingredients":["400 g Hähnchenschenkel oder -brust","300 g festkochende Kartoffeln","2 Paprika","1 Zucchini","1 Zwiebel","150 ml Gemüsebrühe","Olivenöl, Salz, Pfeffer, Paprika, Thymian"],"steps":["Kartoffeln und Gemüse in mundgerechte Stücke schneiden.","Mit dem Hähnchen, Öl, Brühe und Gewürzen in den Topf geben.","Mit Deckel in den kalten Ofen.","60 Minuten bei 200°C schmoren.","Für mehr Farbe die letzten 10 Minuten ohne Deckel.","Mit frischem Thymian bestreuen."]},{"id":1219,"product":"lilly","title":"Cremiges Kartoffel-Lauch-Gratin","category":"Auflauf","time":"45 Min","temp":"200°C","portions":"2–3","ingredients":["600 g festkochende Kartoffeln","1 Stange Lauch","200 ml Sahne","100 ml Milch","100 g geriebener Käse","1 Knoblauchzehe","Salz, Pfeffer, Muskat"],"steps":["Kartoffeln dünn hobeln, Lauch in Ringe schneiden.","Sahne, Milch, Knoblauch und Gewürze verrühren.","Kartoffeln und Lauch in den gefetteten Topf schichten.","Sahnemischung darübergeben und mit Käse bestreuen.","Ohne Deckel in den kalten Ofen, 45 Minuten bei 200°C.","Vor dem Servieren kurz ruhen lassen."]},{"id":1220,"product":"lilly","title":"Ofen-Risotto mit Pilzen","category":"One Pot","time":"40 Min","temp":"200°C","portions":"2–3","ingredients":["200 g Risottoreis","200 g Champignons","1 Zwiebel","1 Knoblauchzehe","550 ml heiße Gemüsebrühe","50 g Parmesan, gerieben","Butter, Salz, Pfeffer"],"steps":["Zwiebel und Knoblauch würfeln, Pilze vierteln.","Reis, Gemüse und Butter in den Topf geben.","Heiße Brühe angießen, einmal umrühren und würzen.","Mit Deckel in den kalten Ofen, 40 Minuten bei 200°C, nach 25 Minuten umrühren.","Parmesan unterrühren und 5 Minuten ruhen lassen.","Cremig rühren und servieren."]},{"id":1221,"product":"lilly","title":"Lachs auf Gemüsebett","category":"Fisch","time":"30 Min","temp":"190°C","portions":"2","ingredients":["2 Lachsfilets","1 Zucchini","200 g Kirschtomaten","1 Fenchel oder Paprika","1/2 Zitrone","Olivenöl, Salz, Pfeffer, Dill"],"steps":["Gemüse schneiden, in den geölten Topf geben und würzen.","Lachsfilets darauflegen, salzen und pfeffern.","Mit Zitronensaft beträufeln und Dill darübergeben.","Mit Deckel in den kalten Ofen, 25 Minuten bei 190°C.","Deckel abnehmen und 5 Minuten weiterbacken.","Mit Zitronenspalten servieren."]},{"id":1222,"product":"lilly","title":"Saftiger Hackbraten","category":"Fleisch","time":"55 Min","temp":"200°C","portions":"3–4","ingredients":["500 g Hackfleisch, gemischt","1 Ei","50 g Semmelbrösel","1 Zwiebel","1 EL Senf","100 ml Brühe","Salz, Pfeffer, Paprika"],"steps":["Hackfleisch mit Ei, Bröseln, gewürfelter Zwiebel, Senf und Gewürzen verkneten.","Zu einem Laib formen und in den gefetteten Topf legen.","Brühe angießen.","Mit Deckel in den kalten Ofen, 45 Minuten bei 200°C.","Deckel abnehmen und 10 Minuten bräunen lassen.","In Scheiben mit dem Bratensaft servieren."]},{"id":1223,"product":"lilly","title":"Feuriges Chili con Carne","category":"Eintopf","time":"60 Min","temp":"190°C","portions":"3–4","ingredients":["400 g Hackfleisch","1 Zwiebel","2 Knoblauchzehen","1 Dose Kidneybohnen","1 Dose Mais","400 g gehackte Tomaten","Chili, Kreuzkümmel, Paprika, Brühe"],"steps":["Hackfleisch, gewürfelte Zwiebel und Knoblauch in den Topf geben.","Bohnen, Mais, Tomaten und Gewürze zufügen und alles vermengen.","Einen kleinen Schuss Brühe angießen.","Mit Deckel in den kalten Ofen, 60 Minuten bei 190°C.","Nach der Hälfte umrühren.","Mit Sauerrahm und Baguette servieren."]},{"id":1224,"product":"lilly","title":"Griechische Moussaka","category":"Auflauf","time":"45 Min","temp":"190°C","portions":"3","ingredients":["2 Auberginen","300 g Kartoffeln","400 g Hackfleisch","400 g gehackte Tomaten","1 Zwiebel","1 Prise Zimt","Béchamel: 30 g Butter, 30 g Mehl, 300 ml Milch, 50 g Käse"],"steps":["Auberginen und Kartoffeln in Scheiben schneiden und kurz anbraten.","Hackfleisch mit Zwiebel anbraten, Tomaten und Zimt zugeben und würzen.","Béchamel kochen: Butter, Mehl, Milch, zum Schluss Käse.","Im gefetteten Topf Kartoffeln, Aubergine und Hacksauce schichten.","Mit Béchamel abschließen.","Ohne Deckel in den kalten Ofen, 45 Minuten bei 190°C goldbraun backen."]},{"id":1225,"product":"lilly","title":"Marokkanische Gemüse-Tajine","category":"Vegetarisch","time":"60 Min","temp":"190°C","portions":"3–4","ingredients":["1 Dose Kichererbsen","300 g Süßkartoffel","2 Möhren","80 g getrocknete Aprikosen","400 g gehackte Tomaten","Zwiebel, Ras el Hanout, Zimt, Brühe"],"steps":["Süßkartoffel, Möhren und Zwiebel würfeln.","Mit Kichererbsen, Aprikosen, Tomaten und Gewürzen in den Topf geben.","Einen Schuss Brühe angießen.","Mit Deckel in den kalten Ofen, 60 Minuten bei 190°C.","Nach der Hälfte umrühren.","Mit Couscous und frischer Minze servieren."]},{"id":1226,"product":"lilly","title":"Cremiger Hähnchen-Tikka-Topf","category":"Geflügel","time":"45 Min (+ 30 Min Marinade)","temp":"190°C","portions":"3","ingredients":["400 g Hähnchenbrust","150 g Naturjoghurt","2–3 EL Tikka-Masala-Paste","400 g gehackte Tomaten","100 ml Sahne","Zwiebel, Knoblauch, Ingwer"],"steps":["Hähnchenwürfel in Joghurt und Paste 30 Minuten marinieren.","Mit gewürfelter Zwiebel, Knoblauch, Ingwer und Tomaten in den Topf geben.","Mit Deckel in den kalten Ofen, 45 Minuten bei 190°C.","Nach der Hälfte umrühren.","Sahne unterrühren und kurz durchziehen lassen.","Mit Reis oder Naan servieren."]},{"id":1227,"product":"lilly","title":"Saftiger Zitronen-Joghurt-Kuchen","category":"Kuchen","time":"45 Min","temp":"175°C","portions":"1 Kuchen","ingredients":["200 g Mehl","1 TL Backpulver","150 g Zucker","3 Eier","100 g Naturjoghurt","80 ml neutrales Öl","1 Zitrone (Saft & Abrieb)"],"steps":["Eier und Zucker schaumig schlagen. Öl, Joghurt und Zitrone unterrühren.","Mehl mit Backpulver mischen und unterheben.","Teig in den gefetteten Topf füllen.","Ohne Deckel in den kalten Ofen, 45 Minuten bei 175°C (Stäbchenprobe).","10 Minuten ruhen, dann auf ein Gitter stürzen.","Mit Zitronen-Puderzucker-Guss überziehen."]},{"id":1228,"product":"lilly","title":"Warmer Apfel-Zimt-Kuchen","category":"Kuchen","time":"40 Min","temp":"180°C","portions":"1 Kuchen","ingredients":["3 Äpfel","200 g Mehl","100 g Zucker","100 g weiche Butter","2 Eier","1 TL Backpulver","1 TL Zimt"],"steps":["Äpfel schälen, in Spalten schneiden und mit Zimt mischen.","Butter und Zucker cremig rühren und die Eier unterrühren.","Mehl mit Backpulver unterheben.","Teig in den gefetteten Topf geben und die Apfelspalten eindrücken.","Ohne Deckel in den kalten Ofen, 40 Minuten bei 180°C.","Lauwarm mit Puderzucker servieren."]},{"id":1229,"product":"lilly","title":"Saftiger Marmorkuchen","category":"Kuchen","time":"45 Min","temp":"170°C","portions":"1 Kuchen","ingredients":["150 g weiche Butter","150 g Zucker","3 Eier","250 g Mehl","1 TL Backpulver","80 ml Milch","2 EL Kakao"],"steps":["Butter, Zucker und Vanille cremig rühren und die Eier einzeln zugeben.","Mehl mit Backpulver abwechselnd mit Milch unterrühren.","Die Hälfte des hellen Teigs in den gefetteten Topf geben.","Rest mit Kakao und 1 EL Milch verrühren und daraufgeben.","Mit einer Gabel spiralförmig marmorieren.","Ohne Deckel in den kalten Ofen, 45 Minuten bei 170°C."]},{"id":1230,"product":"lilly","title":"Schoko-Bananenbrot","category":"Kuchen","time":"50 Min","temp":"170°C","portions":"1 Brot","ingredients":["3 reife Bananen","2 Eier","80 g Zucker","60 ml neutrales Öl","220 g Mehl","1 TL Backpulver","2 EL Kakao","60 g Schokotropfen"],"steps":["Bananen fein zerdrücken.","Mit Eiern, Zucker und Öl verrühren.","Mehl, Backpulver, Kakao und eine Prise Salz unterheben.","Schokotropfen unterziehen und den Teig in den gefetteten Topf geben.","Ohne Deckel in den kalten Ofen, 50 Minuten bei 170°C.","Etwas abkühlen, dann auf einem Gitter auskühlen lassen."]},{"id":1231,"product":"lilly","title":"Cremiger Käsekuchen","category":"Kuchen","time":"60 Min","temp":"160°C","portions":"1 Kuchen","ingredients":["150 g Butterkekse","60 g Butter, geschmolzen","500 g Magerquark","200 g Frischkäse","120 g Zucker","3 Eier","2 EL Speisestärke"],"steps":["Kekse fein zerbröseln und mit Butter mischen.","Als Boden in den gefetteten Topf drücken.","Quark, Frischkäse, Zucker, Eier, Stärke und etwas Zitrone verrühren.","Masse auf den Boden geben.","Ohne Deckel in den kalten Ofen, 60 Minuten bei 160°C.","Im ausgeschalteten Ofen langsam auskühlen lassen."]},{"id":2001,"product":"ofenzauberer","title":"Apfel-Streuselkuchen vom Blech","category":"Kuchenliebe","time":"35 Min","temp":"180°C","portions":"ca. 20 Stueck","ingredients":["125 g weiche Butter","100 g Zucker","2 Eier","250 g Mehl","1 TL Backpulver","3 EL Milch","600 g Aepfel","Fuer die Streusel: 150 g Mehl, 80 g Butter, 70 g Zucker, Zimt"],"steps":["Backrahmen auf James stellen und leicht fetten.","Butter, Zucker und Eier cremig ruehren, Mehl, Backpulver und Milch unterruehren.","Teig im Rahmen verstreichen, Apfelspalten dachziegelartig darauflegen.","Streuselzutaten zu Broeseln kneten und darueberstreuen.","Ca. 35 Min. bei 180°C backen.","Auskuehlen lassen und mit Puderzucker bestaeuben.","Tipp: Mehr Frucht mit saeuerlichen Aepfeln wie Boskoop. Variante: mit Birnen oder Beeren."]},{"id":2002,"product":"ofenzauberer","title":"Zwetschgenkuchen mit Zimtstreuseln","category":"Kuchenliebe","time":"35 Min","temp":"190°C","portions":"ca. 20 Stueck","ingredients":["300 g Mehl","1/2 Pck. Trockenhefe","120 ml lauwarme Milch","50 g weiche Butter","40 g Zucker","1 Ei","800 g Zwetschgen","Fuer die Streusel: 120 g Mehl, 60 g Butter, 60 g Zucker, Zimt"],"steps":["Hefeteig kneten und abgedeckt 45 Min. gehen lassen.","Backrahmen auf James stellen, Teig hineindruecken.","Zwetschgen halbieren und dicht an dicht einschichten.","15 Min. ruhen lassen, dann mit Streuseln bestreuen.","Ca. 35 Min. bei 190°C backen.","Lauwarm mit Sahne servieren.","Tipp: Zwetschgen mit der Schnittflaeche nach oben legen. Variante: mit Mandelblaettchen statt Streuseln."]},{"id":2003,"product":"ofenzauberer","title":"Rhabarber-Baiser-Kuchen","category":"Kuchenliebe","time":"40 Min","temp":"175 → 150°C","portions":"ca. 20 Stueck","ingredients":["100 g weiche Butter","80 g Zucker","3 Eier (getrennt)","200 g Mehl","1 TL Backpulver","500 g Rhabarber","Fuer das Baiser: 3 Eiweiss, 120 g Zucker"],"steps":["Butter, Zucker und Eigelb cremig ruehren, Mehl, Backpulver und 2 EL Milch unterheben.","Teig im gefetteten Rahmen verstreichen, Rhabarberstuecke darauf verteilen.","25 Min. bei 175°C vorbacken.","Eiweiss steif schlagen, Zucker einrieseln lassen.","Baiser auf den Kuchen streichen, weitere 15 Min. bei 150°C backen.","Vollstaendig auskuehlen lassen.","Tipp: Rhabarber vorher zuckern und abtropfen lassen. Variante: mit Stachelbeeren oder Johannisbeeren."]},{"id":2004,"product":"ofenzauberer","title":"Beeren-Quark-Blechkuchen","category":"Kuchenliebe","time":"45 Min","temp":"175°C","portions":"ca. 20 Stueck","ingredients":["100 g weiche Butter","80 g Zucker","2 Eier","200 g Mehl","1 TL Backpulver","Quarkschicht: 500 g Magerquark, 2 Eier, 80 g Zucker, 2 EL Staerke","200 g Beeren (auch TK)"],"steps":["Butter, Zucker und Eier cremig ruehren, Mehl und Backpulver unterheben.","Teig im gefetteten Rahmen verstreichen.","Quark mit Eiern, Zucker, Staerke und Vanille glatt ruehren, darauf verteilen.","Beeren gleichmaessig einstreuen.","Ca. 45 Min. bei 175°C backen.","Auskuehlen lassen und kuehl servieren.","Tipp: TK-Beeren nicht auftauen. Variante: mit Pfirsich- oder Aprikosenstuecken."]},{"id":2005,"product":"ofenzauberer","title":"Saftige Schoko-Brownies","category":"Kuchenliebe","time":"30 Min","temp":"175°C","portions":"ca. 24 Stueck (Rahmen 20x28)","ingredients":["200 g Zartbitterschokolade","150 g Butter","200 g Zucker","3 Eier","120 g Mehl","2 EL Kakao","80 g gehackte Walnuesse"],"steps":["Backrahmen auf James kleiner einstellen (dickere Brownies), Backpapier einlegen.","Schokolade mit Butter schmelzen, etwas abkuehlen.","Eier und Zucker schaumig schlagen, Schokomasse unterruehren.","Mehl, Kakao, eine Prise Salz und Nuesse unterheben.","Teig einfuellen, ca. 30 Min. bei 175°C backen - die Mitte darf noch weich sein.","Vollstaendig auskuehlen, dann in Wuerfel schneiden.","Tipp: Staebchenprobe darf noch feucht sein. Variante: mit Karamell- oder Erdnussbutter-Swirl."]},{"id":2006,"product":"ofenzauberer","title":"Saftiger Schoko-Blechkuchen","category":"Kuchenliebe","time":"30 Min","temp":"180°C","portions":"ca. 20 Stueck","ingredients":["250 g Mehl","200 g Zucker","50 g Kakao","1,5 TL Backpulver","2 Eier","200 ml Milch","100 ml Oel","100 ml heisser Kaffee","Glasur: 150 g Schokolade"],"steps":["Alle trockenen Zutaten mischen.","Eier, Milch und Oel zugeben und verruehren.","Heissen Kaffee unterruehren - der Teig wird recht fluessig.","In den gefetteten Rahmen (mit Backpapier) giessen.","Ca. 30 Min. bei 180°C backen, Staebchenprobe.","Auskuehlen, mit geschmolzener Schokolade ueberziehen.","Tipp: Kaffee verstaerkt nur das Schokoaroma. Variante: Schokostueckchen unter den Teig heben."]},{"id":2007,"product":"ofenzauberer","title":"Nuss-Nougat-Schnitten","category":"Kuchenliebe","time":"30 Min","temp":"180°C","portions":"ca. 24 Schnitten","ingredients":["150 g weiche Butter","120 g Zucker","3 Eier","150 g Mehl","150 g gemahlene Haselnuesse","1 TL Backpulver","Decke: 100 g Nougat, 100 g Schokolade"],"steps":["Butter, Zucker und Eier cremig ruehren.","Mehl, Haselnuesse, Backpulver und 3 EL Milch unterheben.","Teig im gefetteten Rahmen verstreichen.","Ca. 30 Min. bei 180°C backen, auskuehlen lassen.","Nougat und Schokolade schmelzen, auf dem Boden verstreichen.","Antrocknen lassen, in Schnitten schneiden.","Tipp: Mit der Gabel ein Wellenmuster ziehen. Variante: mit gemahlenen Mandeln."]},{"id":2008,"product":"ofenzauberer","title":"Schoko-Birnen-Kuchen","category":"Kuchenliebe","time":"35 Min","temp":"175°C","portions":"ca. 20 Stueck","ingredients":["125 g weiche Butter","120 g Zucker","3 Eier","180 g Mehl","30 g Kakao","1 TL Backpulver","6 Birnenhaelften (Dose)"],"steps":["Butter, Zucker und Eier cremig ruehren.","Mehl, Kakao, Backpulver und 4 EL Milch unterruehren.","Teig im gefetteten Rahmen verstreichen.","Birnenhaelften abtropfen, faechern und eindruecken.","Ca. 35 Min. bei 175°C backen.","Mit Puderzucker oder Schokoglasur servieren.","Tipp: Birnen gut abtropfen. Variante: mit Schokostreuseln vor dem Backen."]},{"id":2009,"product":"ofenzauberer","title":"Klassischer Kaesekuchen vom Blech","category":"Kuchenliebe","time":"60 Min","temp":"160°C","portions":"ca. 24 Stueck","ingredients":["Muerbeteig: 250 g Mehl, 125 g Butter, 80 g Zucker, 1 Ei","Fuellung: 1 kg Magerquark, 200 g Zucker, 4 Eier, 1 Pck. Vanillepuddingpulver, 100 ml Oel, 100 ml Milch"],"steps":["Muerbeteig kneten, 20 Min. kuehlen.","Backrahmen auf James, Teig als Boden mit kleinem Rand andruecken.","Quark, Zucker, Eier, Puddingpulver, Oel, Milch und Zitronenabrieb glatt ruehren.","Fuellung einfuellen und glatt streichen.","Ca. 60 Min. bei 160°C backen.","Im ausgeschalteten Ofen langsam abkuehlen lassen.","Tipp: Nicht zu heiss backen und langsam abkuehlen. Variante: mit abgetropften Mandarinen."]},{"id":2010,"product":"ofenzauberer","title":"Russischer Zupfkuchen (Backrahmen)","category":"Kuchenliebe","time":"50 Min","temp":"175°C","portions":"ca. 24 Stueck","ingredients":["Teig: 250 g Mehl, 30 g Kakao, 125 g Butter, 100 g Zucker, 1 Ei","Fuellung: 500 g Quark, 200 g Frischkaese, 150 g Zucker, 3 Eier, 1 Pck. Puddingpulver, 80 g Butter"],"steps":["Teigzutaten verkneten, kurz kuehlen.","Zwei Drittel des Teigs als Boden in den Rahmen druecken.","Fuellung glatt ruehren und einfuellen.","Restlichen Teig in Stuecken darueberzupfen.","Ca. 50 Min. bei 175°C backen.","Auskuehlen lassen.","Tipp: Teig vorher kurz kalt stellen. Variante: mit Kirschen in der Fuellung."]},{"id":2011,"product":"ofenzauberer","title":"Mandarinen-Schmand-Kuchen","category":"Kuchenliebe","time":"45 Min","temp":"175°C","portions":"ca. 20 Stueck","ingredients":["100 g weiche Butter","100 g Zucker","2 Eier","200 g Mehl","1 TL Backpulver","Decke: 400 g Schmand, 1 Pck. Vanillepuddingpulver, 60 g Zucker","2 Dosen Mandarinen"],"steps":["Ruehrteig anruehren, im gefetteten Rahmen verstreichen.","20 Min. bei 175°C vorbacken.","Abgetropfte Mandarinen darauf verteilen.","Schmand mit Puddingpulver und Zucker verruehren, daruebergeben.","Weitere 25 Min. backen.","Gut auskuehlen lassen.","Tipp: Mandarinen sehr gut abtropfen lassen. Variante: mit Pfirsich oder Kirschen."]},{"id":2012,"product":"ofenzauberer","title":"Kaese-Sahne-Schnitten","category":"Kuchenliebe","time":"12 Min","temp":"180°C","portions":"ca. 20 Stueck","ingredients":["Biskuit: 3 Eier, 100 g Zucker, 100 g Mehl","Creme: 500 g Magerquark, 400 g Sahne, 100 g Zucker, 6 Blatt Gelatine, 1 Zitrone"],"steps":["Biskuit im Rahmen 12 Min. bei 180°C backen, auskuehlen, waagerecht halbieren.","Gelatine einweichen und aufloesen.","Quark mit Zucker und Zitrone verruehren, Gelatine unterruehren, Sahne unterheben.","Rahmen um den unteren Boden setzen, Creme einfuellen.","Zweiten Boden auflegen, mind. 4 Std. kuehlen.","Mit Puderzucker bestaeuben und in Schnitten schneiden.","Tipp: Am besten ueber Nacht durchkuehlen. Variante: eine Schicht Beeren in die Creme geben."]},{"id":2013,"product":"ofenzauberer","title":"Donauwelle","category":"Kuchenliebe","time":"30 Min","temp":"180°C","portions":"ca. 24 Stueck","ingredients":["200 g Butter","180 g Zucker","4 Eier","300 g Mehl","2 TL Backpulver","2 EL Kakao","1 Glas Schattenmorellen","Creme: 1 Pck. Vanillepudding, 500 ml Milch, 200 g Butter","Glasur: 200 g Schokolade"],"steps":["Ruehrteig anruehren, Haelfte mit Kakao verfaerben.","Hellen Teig im Rahmen verstreichen, dunklen daraufgeben.","Abgetropfte Kirschen eindruecken, 30 Min. bei 180°C backen, auskuehlen.","Pudding kochen, abkuehlen, mit weicher Butter aufschlagen und aufstreichen.","Schokolade schmelzen, ueberziehen, mit der Gabel Wellen ziehen.","Kalt stellen, dann in Stuecke schneiden.","Tipp: Pudding und Butter gleich temperiert verarbeiten. Variante: Glasur mit etwas Kokosfett."]},{"id":2014,"product":"ofenzauberer","title":"Bienenstich vom Blech","category":"Kuchenliebe","time":"30 Min","temp":"180°C","portions":"ca. 20 Stueck","ingredients":["Hefeteig: 300 g Mehl, 1/2 Pck. Hefe, 120 ml Milch, 50 g Butter, 40 g Zucker","Mandeldecke: 100 g Butter, 100 g Zucker, 2 EL Honig, 150 g Mandelblaettchen","Fuellung: 1 Pck. Pudding, 200 g Sahne"],"steps":["Hefeteig kneten, 45 Min. gehen lassen, in den Rahmen druecken.","Butter, Zucker, Honig und 3 EL Sahne aufkochen, Mandeln unterruehren.","Mandelmasse auf dem Teig verteilen, 15 Min. ruhen lassen.","Ca. 30 Min. bei 180°C goldbraun backen, auskuehlen.","Pudding kochen, abkuehlen, geschlagene Sahne unterheben.","Boden waagerecht teilen, fuellen, wieder zusammensetzen.","Tipp: Erst fuellen, wenn der Boden kalt ist. Variante: mit Pudding-Buttercreme."]},{"id":2015,"product":"ofenzauberer","title":"Eierlikoer-Blechkuchen","category":"Kuchenliebe","time":"30 Min","temp":"175°C","portions":"ca. 20 Stueck","ingredients":["200 g weiche Butter","180 g Zucker","4 Eier","250 g Mehl","2 TL Backpulver","150 ml Eierlikoer","100 ml neutrales Oel","100 g Schokoraspel"],"steps":["Butter, Zucker und Eier schaumig schlagen.","Eierlikoer und Oel unterruehren.","Mehl, Backpulver und Schokoraspel unterheben.","Teig in den gefetteten Rahmen geben.","Ca. 30 Min. bei 175°C backen.","Mit Puderzucker oder Eierlikoer-Guss servieren.","Tipp: Schmeckt am Backtag am saftigsten. Variante: mit Sahnehaube und Schokoraspeln."]},{"id":2016,"product":"ofenzauberer","title":"Schneller Zitronen-Blechkuchen","category":"Kuchenliebe","time":"28 Min","temp":"175°C","portions":"ca. 20 Stueck","ingredients":["200 g weiche Butter","180 g Zucker","4 Eier","300 g Mehl","2 TL Backpulver","100 ml Milch","1 Zitrone (Saft & Abrieb)","Guss: 150 g Puderzucker + Zitronensaft"],"steps":["Butter, Zucker und Eier schaumig ruehren.","Mehl, Backpulver, Milch, Zitronensaft und Abrieb unterruehren.","Teig im gefetteten Rahmen verstreichen.","Ca. 28 Min. bei 175°C backen.","Puderzucker mit Zitronensaft glatt ruehren.","Guss auf den noch warmen Kuchen streichen.","Tipp: Guss auf den warmen Kuchen auftragen. Variante: mit Limette oder Orange."]},{"id":2017,"product":"ofenzauberer","title":"Marmor-Blechkuchen","category":"Kuchenliebe","time":"30 Min","temp":"175°C","portions":"ca. 20 Stueck","ingredients":["200 g weiche Butter","180 g Zucker","4 Eier","320 g Mehl","2 TL Backpulver","100 ml Milch","2 EL Kakao"],"steps":["Butter, Zucker und Eier schaumig ruehren.","Mehl, Backpulver und Milch unterruehren.","Zwei Drittel des Teigs im Rahmen verstreichen.","Rest mit Kakao und 1 EL Milch verruehren, daraufgeben.","Mit einer Gabel spiralfoermig marmorieren.","Ca. 30 Min. bei 175°C backen.","Tipp: Gabel nur wenige Male durchziehen. Variante: mit Schokostueckchen."]},{"id":2018,"product":"ofenzauberer","title":"Saftiger Moehren-Blechkuchen","category":"Kuchenliebe","time":"35 Min","temp":"175°C","portions":"ca. 20 Stueck","ingredients":["300 g fein geraspelte Moehren","150 g gemahlene Mandeln","150 g Mehl","180 g Zucker","4 Eier","150 ml Oel","2 TL Backpulver","1 TL Zimt","Frosting: 200 g Frischkaese, 80 g Puderzucker, 50 g Butter"],"steps":["Eier und Zucker schaumig schlagen, Oel unterruehren.","Mehl, Mandeln, Backpulver und Zimt unterheben.","Moehren unterziehen, Teig im Rahmen verstreichen.","Ca. 35 Min. bei 175°C backen, auskuehlen.","Frosting glatt ruehren und aufstreichen.","In Stuecke schneiden.","Tipp: Am zweiten Tag noch saftiger. Variante: mit gehackten Walnuessen."]},{"id":2019,"product":"ofenzauberer","title":"Erdbeer-Sahne-Schnitten","category":"Kuchenliebe","time":"15 Min","temp":"180°C","portions":"ca. 20 Stueck","ingredients":["Biskuit: 4 Eier, 120 g Zucker, 120 g Mehl","Belag: 400 g Sahne, 2 Pck. Sahnesteif, 500 g Erdbeeren, 1 Pck. roter Tortenguss"],"steps":["Biskuit im Rahmen 15 Min. bei 180°C backen, auskuehlen.","Rahmen wieder aufsetzen.","Sahne mit Sahnesteif steif schlagen, auf dem Boden verteilen.","Erdbeeren halbieren und dicht auflegen.","Tortenguss nach Packung kochen, daruebergeben.","Kuehlen, dann in Schnitten schneiden.","Tipp: Rahmen zum Schneiden dranlassen. Variante: mit gemischten Beeren."]},{"id":2020,"product":"ofenzauberer","title":"Kirsch-Schoko-Schnitten","category":"Kuchenliebe","time":"15 Min","temp":"180°C","portions":"ca. 20 Stueck","ingredients":["Schoko-Biskuit: 4 Eier, 120 g Zucker, 100 g Mehl, 30 g Kakao","Belag: 1 Glas Schattenmorellen, 400 g Sahne, 2 Pck. Sahnesteif, 50 g Schokoraspel"],"steps":["Schoko-Biskuit im Rahmen 15 Min. bei 180°C backen, auskuehlen.","Boden mit etwas Kirschsaft betraeufeln.","Abgetropfte Kirschen darauf verteilen.","Sahne steif schlagen und aufstreichen.","Mit Schokoraspeln bestreuen.","Gut kuehlen, dann schneiden.","Tipp: Boden grosszuegig mit Kirschsaft traenken. Variante: ein Schuss Kirschwasser."]},{"id":2021,"product":"ofenzauberer","title":"Himbeer-Mascarpone-Schnitten","category":"Kuchenliebe","time":"15 Min","temp":"180°C","portions":"ca. 20 Stueck","ingredients":["Boden: 4 Eier, 120 g Zucker, 120 g Mehl","Creme: 250 g Mascarpone, 300 g Sahne, 60 g Puderzucker","300 g Himbeeren"],"steps":["Biskuit im Rahmen 15 Min. bei 180°C backen, auskuehlen.","Mascarpone mit Puderzucker und Vanille glatt ruehren.","Sahne steif schlagen und unterheben.","Creme auf dem Boden verteilen.","Himbeeren darauf verteilen.","Kuehlen und in Schnitten schneiden.","Tipp: Beeren erst kurz vor dem Servieren. Variante: mit Brombeeren oder Heidelbeeren."]},{"id":2022,"product":"ofenzauberer","title":"Knusprige Blechpizza","category":"Kuchenliebe","time":"20 Min","temp":"220°C","portions":"1 Blech","ingredients":["350 g Mehl","1/2 Pck. Trockenhefe","200 ml lauwarmes Wasser","2 EL Olivenoel","1 TL Salz","Belag: passierte Tomaten, Mozzarella, nach Wahl"],"steps":["Hefeteig kneten und 45 Min. gehen lassen.","Backrahmen auf James, Backpapier darunter, Teig duenn ausdruecken.","Mit Tomaten bestreichen und nach Wunsch belegen.","Mozzarella darauf verteilen.","Ca. 20 Min. bei 220°C knusprig backen.","Mit frischem Basilikum servieren.","Tipp: Teig duenn ausziehen. Variante: weisse Pizza mit Creme fraiche."]},{"id":2023,"product":"ofenzauberer","title":"Zwiebelkuchen vom Blech","category":"Kuchenliebe","time":"35 Min","temp":"200°C","portions":"ca. 12 Stueck","ingredients":["Teig: 300 g Mehl, 1/2 Pck. Hefe, 120 ml Milch, 50 g Butter","Belag: 800 g Zwiebeln, 150 g Speck, 3 Eier, 200 g Schmand","Kuemmel, Salz, Pfeffer"],"steps":["Hefeteig kneten, 45 Min. gehen lassen.","Zwiebeln und Speck glasig duensten, abkuehlen.","Eier mit Schmand und Gewuerzen verquirlen, Zwiebeln unterruehren.","Teig in den gefetteten Rahmen druecken.","Zwiebelmasse darauf verteilen.","Ca. 35 Min. bei 200°C backen.","Tipp: Dazu ein Glas Federweisser. Variante: vegetarisch mit Lauch."]},{"id":2024,"product":"ofenzauberer","title":"Mediterrane Focaccia (Backrahmen)","category":"Kuchenliebe","time":"25 Min","temp":"220°C","portions":"1 Blech","ingredients":["350 g Mehl","1/2 Pck. Trockenhefe","230 ml lauwarmes Wasser","3 EL Olivenoel","1 TL Salz","Belag: Kirschtomaten, Rosmarin, Oliven, Meersalz"],"steps":["Weichen Teig kneten, 60 Min. gehen lassen.","Rahmen auf James grosszuegig oelen, Teig hineindruecken.","Mit oeligen Fingern Dellen eindruecken.","Tomaten, Oliven und Rosmarin daraufsetzen, mit Meersalz bestreuen.","Ca. 25 Min. bei 220°C backen.","Lauwarm in Stuecke schneiden.","Tipp: Reichlich Olivenoel verwenden. Variante: mit duennen Zwiebelringen."]},{"id":2025,"product":"ofenzauberer","title":"Elsaesser Flammkuchen (Backrahmen)","category":"Kuchenliebe","time":"15 Min","temp":"230°C","portions":"1 Blech","ingredients":["250 g Mehl","120 ml lauwarmes Wasser","2 EL Olivenoel","1 Prise Salz","Belag: 200 g Creme fraiche, 100 g Schmand, 2 Zwiebeln, 150 g Speckwuerfel"],"steps":["Mehl, Wasser, Oel und Salz zu einem glatten Teig kneten, 20 Min. ruhen lassen.","Backrahmen auf James, Backpapier darunter, Teig hauchduenn ausrollen.","Creme fraiche und Schmand verruehren, mit Salz, Pfeffer und Muskat wuerzen.","Duenn aufstreichen, Zwiebelringe und Speck darauf verteilen.","Ca. 15 Min. bei 230°C knusprig backen.","Sofort servieren.","Tipp: Teig wirklich duenn ausrollen. Suesse Variante: mit Apfelscheiben, Zimt und Creme fraiche."]},{"id":2026,"product":"ofenzauberer","title":"Quiche Lorraine vom Blech","category":"Kuchenliebe","time":"35 Min","temp":"190°C","portions":"ca. 12 Stueck","ingredients":["Muerbeteig: 250 g Mehl, 125 g Butter, 1 Ei, 1 Prise Salz","Guss: 4 Eier, 200 g Sahne, 100 ml Milch, 100 g Kaese","150 g Speck","1 Zwiebel"],"steps":["Muerbeteig kneten, 20 Min. kuehlen.","Rahmen auf James, Teig als Boden mit kleinem Rand andruecken, 10 Min. blind vorbacken.","Speck und Zwiebel anbraten, auf dem Boden verteilen.","Eier, Sahne, Milch und Kaese verquirlen, mit Muskat wuerzen.","Guss darueber giessen.","Ca. 35 Min. bei 190°C goldgelb backen.","Tipp: Boden kurz blind vorbacken. Variante: mit Lauch statt Zwiebel."]},{"id":2027,"product":"ofenzauberer","title":"Bunte Gemuese-Quiche","category":"Kuchenliebe","time":"35 Min","temp":"190°C","portions":"ca. 12 Stueck","ingredients":["Muerbeteig: 250 g Mehl, 125 g Butter, 1 Ei","Belag: 200 g Brokkoli, 1 Paprika, 1 Lauch, 150 g Cherrytomaten","4 Eier","250 g Sahne","100 g geriebener Kaese"],"steps":["Muerbeteig kneten, kuehlen, in den Rahmen druecken.","Brokkoli kurz blanchieren, uebriges Gemuese klein schneiden und kurz anbraten.","Gemuese auf dem Boden verteilen.","Eier, Sahne und Kaese verquirlen, wuerzen, daruebergiessen.","Ca. 35 Min. bei 190°C backen.","Lauwarm oder kalt servieren.","Tipp: Gemuese vorgaren und gut abtropfen. Variante: mit Feta- oder Ziegenkaese."]},{"id":2028,"product":"ofenzauberer","title":"Spinat-Feta-Blechkuchen","category":"Kuchenliebe","time":"30 Min","temp":"200°C","portions":"ca. 12 Stueck","ingredients":["2 Rollen Blaetterteig","450 g Blattspinat (TK)","200 g Feta","1 Zwiebel","1 Knoblauchzehe","2 Eier","Muskat, Salz, Pfeffer","Ei zum Bestreichen"],"steps":["Spinat auftauen und gut ausdruecken.","Mit zerbroeseltem Feta, Zwiebel, Knoblauch, Eiern und Gewuerzen mischen.","Rahmen auf James, mit einer Teigbahn als Boden und Rand auslegen.","Fuellung einfuellen, mit der zweiten Teigbahn bedecken, Raender andruecken.","Mit Ei bestreichen und einschneiden.","Ca. 30 Min. bei 200°C goldbraun backen.","Tipp: Spinat kraeftig ausdruecken. Variante: mit etwas Hackfleisch."]},{"id":2029,"product":"ofenzauberer","title":"Lasagne vom Blech","category":"Kuchenliebe","time":"40 Min","temp":"190°C","portions":"ca. 6 Portionen","ingredients":["500 g Hackfleisch","1 Zwiebel","2 EL Tomatenmark","800 g gehackte Tomaten","ca. 12 Lasagneplatten","150 g geriebener Kaese","Bechamel: 50 g Butter, 50 g Mehl, 600 ml Milch"],"steps":["Hackfleisch mit Zwiebel anbraten, Tomatenmark und Tomaten zugeben, wuerzen, koecheln lassen.","Bechamel kochen: Butter schmelzen, Mehl anschwitzen, Milch einruehren.","Rahmen auf James fetten.","Abwechselnd Bolognese, Platten und Bechamel schichten.","Mit Bechamel und Kaese abschliessen.","Ca. 40 Min. bei 190°C backen, 10 Min. ruhen lassen.","Tipp: Nach dem Backen kurz ruhen lassen. Variante: vegetarisch mit Zucchini, Aubergine, Spinat."]},{"id":2030,"product":"ofenzauberer","title":"Pizza-Zupfbroetchen","category":"Kuchenliebe","time":"25 Min","temp":"200°C","portions":"ca. 20 Stueck","ingredients":["350 g Mehl","1/2 Pck. Trockenhefe","200 ml lauwarmes Wasser","2 EL Olivenoel","1 TL Salz","150 g Pizzasauce","150 g Kaese","100 g Salami oder Schinken"],"steps":["Hefeteig kneten und 45 Min. gehen lassen.","Kleine Kugeln formen, in Pizzasauce und geriebenem Kaese waelzen.","Mit gewuerfelter Salami im gefetteten Rahmen dicht an dicht setzen.","15 Min. ruhen lassen, restlichen Kaese darueber.","Ca. 25 Min. bei 200°C goldbraun backen.","Warm zum Zupfen servieren.","Tipp: Dazu Kraeuterquark oder Tomatensauce. Variante: vegetarisch mit Paprika und Mais."]},{"id":2031,"product":"ofenzauberer","title":"Zwei auf einem Blech - Trennwand-Trick","category":"Kuchenliebe","time":"20 Min","temp":"220°C","portions":"2 Sorten","ingredients":["Trennwand aus mehrfach gefaltetem Backpapier oder Alufolie","1 Portion Pizzateig (siehe Knusprige Blechpizza)","Haelfte A - mild: Tomatensauce & Kaese","Haelfte B - herzhaft: Salami, Paprika, Zwiebel"],"steps":["Backrahmen auf James stellen, Backpapier darunterlegen.","Aus mehrfach gefaltetem Backpapier eine feste Trennwand formen und mittig einsetzen.","Beide Faecher mit duenn ausgezogenem Pizzateig auslegen.","Linke Haelfte mild belegen, rechte Haelfte herzhaft.","Ca. 20 Min. bei 220°C backen.","Trennwand vorsichtig ziehen, beide Sorten in Stuecke schneiden.","Tipp: Beide Sorten sollten bei aehnlicher Temperatur und Zeit backen."]},{"id":2101,"product":"ofenzauberer","title":"Knusprige Sonntags-Broetchen","category":"Alles vom Stein","time":"25 Min (+ 80 Min Gehzeit)","temp":"220°C","portions":"ca. 16 Stueck","ingredients":["700 g Weizenmehl Type 550","2 Pck. Trockenhefe (12 g)","420 ml lauwarmes Wasser","40 g Butter","2 TL Zucker","14 g Salz"],"steps":["Alle Zutaten zu einem glatten Teig kneten, 60 Min. gehen lassen.","16 Broetchen formen.","Auf den bemehlten Stein setzen - etwa zwei Drittel der Flaeche belegen.","20 Min. ruhen lassen, einschneiden, mit Wasser bespruehen.","Eine Schale Wasser mit in den Ofen stellen.","In den kalten Ofen, 25 Min. bei 220°C. Lauwarm servieren.","Tipp: Die Wasserschale sorgt fuer Schwaden. Variante: mit Sesam oder Mohn bestreuen."]},{"id":2102,"product":"ofenzauberer","title":"Koerner-Semmeln","category":"Alles vom Stein","time":"25 Min (+ 80 Min Gehzeit)","temp":"220°C","portions":"ca. 16 Stueck","ingredients":["500 g Weizenmehl Type 1050","200 g Dinkelvollkornmehl","2 Pck. Trockenhefe (12 g)","450 g lauwarmes Wasser","14 g Salz","100 g Saatenmix"],"steps":["Saaten kurz ohne Fett anroesten, abkuehlen lassen.","Alle Zutaten kneten, Saaten unterarbeiten, 60 Min. gehen lassen.","16 Semmeln formen und in Saaten waelzen.","Auf den bemehlten Stein setzen, 20 Min. ruhen, einschneiden.","Eine Schale Wasser mit in den Ofen stellen.","In den kalten Ofen, 25 Min. bei 220°C. Auskuehlen lassen.","Tipp: Leinsamen vorab quellen lassen. Variante: mit Haferflocken im Teig."]},{"id":2103,"product":"ofenzauberer","title":"Rustikale Baguettes","category":"Alles vom Stein","time":"25 Min (+ 90 Min Gehzeit)","temp":"230°C","portions":"3 Baguettes","ingredients":["600 g Weizenmehl Type 550","1 Pck. Trockenhefe (8 g)","420 g lauwarmes Wasser","12 g Salz"],"steps":["Zu einem weichen Teig kneten, 90 Min. gehen lassen.","In drei Straenge formen.","Nebeneinander auf den bemehlten Stein legen.","Schraeg einschneiden, mit Wasser bespruehen.","Eine Schale Wasser mit in den Ofen stellen.","In den kalten Ofen, 25 Min. bei 230°C. Auskuehlen lassen.","Tipp: Teig weich fuehren fuer grosse Poren. Variante: die Haelfte des Mehls durch Dinkel ersetzen."]},{"id":2104,"product":"ofenzauberer","title":"Kraeuter-Baguette","category":"Alles vom Stein","time":"25 Min (+ 90 Min Gehzeit)","temp":"230°C","portions":"3 Baguettes","ingredients":["600 g Weizenmehl Type 550","1 Pck. Trockenhefe (8 g)","410 g lauwarmes Wasser","2 EL Olivenoel","12 g Salz","Knoblauch & gehackte Kraeuter"],"steps":["Teig mit Olivenoel kneten, 90 Min. gehen lassen.","Knoblauch und Kraeuter einarbeiten.","Drei Straenge formen, nebeneinander auf den Stein legen.","Schraeg einschneiden.","In den kalten Ofen, 25 Min. bei 230°C.","Lauwarm servieren.","Tipp: Warm mit Kraeuterbutter bestreichen. Variante: mit getrockneten Tomaten."]},{"id":2105,"product":"ofenzauberer","title":"Rosmarin-Focaccia (Stein)","category":"Alles vom Stein","time":"28 Min (+ 70 Min Gehzeit)","temp":"220°C","portions":"1 Blech","ingredients":["500 g Weizenmehl Type 550","1 Pck. Trockenhefe (7 g)","350 g lauwarmes Wasser","40 g Olivenoel","10 g Salz","Rosmarin & Meersalz"],"steps":["Weichen Teig kneten, 60 Min. gehen lassen.","Stein grosszuegig oelen, Teig flach darauf verteilen (etwa zwei Drittel der Flaeche).","Mit oeligen Fingern die typischen Dellen eindruecken.","Mit Olivenoel, Rosmarin und Meersalz belegen, 20 Min. ruhen.","In den kalten Ofen, 28 Min. bei 220°C.","Lauwarm in Stuecke schneiden.","Tipp: Reichlich Olivenoel. Variante: mit Kirschtomaten und Oliven."]},{"id":2106,"product":"ofenzauberer","title":"Tomaten-Oliven-Focaccia","category":"Alles vom Stein","time":"28 Min (+ 70 Min Gehzeit)","temp":"220°C","portions":"1 Blech","ingredients":["500 g Weizenmehl Type 550","1 Pck. Trockenhefe (7 g)","350 g lauwarmes Wasser","40 g Olivenoel","10 g Salz","200 g Kirschtomaten","100 g Oliven","Rosmarin & Meersalz"],"steps":["Weichen Teig kneten, 60 Min. gehen lassen.","Stein oelen, Teig flach darauf verteilen.","Dellen eindruecken, mit Tomaten, Oliven und Rosmarin belegen.","20 Min. ruhen, mit Meersalz bestreuen.","In den kalten Ofen, 28 Min. bei 220°C.","Lauwarm servieren.","Tipp: Tomaten leicht in den Teig druecken. Variante: mit Feta-Stuecken."]},{"id":2107,"product":"ofenzauberer","title":"Kraeuter-Fladenbrot","category":"Alles vom Stein","time":"22 Min (+ 60 Min Gehzeit)","temp":"230°C","portions":"1 grosses Fladenbrot","ingredients":["450 g Weizenmehl Type 550","1 Pck. Trockenhefe (7 g)","280 g lauwarmes Wasser","2 EL Olivenoel","9 g Salz","Knoblauch-Kraeuter-Oel zum Bestreichen"],"steps":["Teig kneten, 45 Min. gehen lassen.","Flach auf den bemehlten Stein druecken (etwa zwei Drittel der Flaeche).","Mit den Fingern Dellen eindruecken, 15 Min. ruhen.","Mit Knoblauch-Kraeuter-Oel bestreichen.","In den kalten Ofen, 22 Min. bei 230°C.","Lauwarm in Streifen schneiden.","Tipp: Dazu Kraeuterquark oder Tzatziki. Variante: mit Sesam und Schwarzkuemmel."]},{"id":2108,"product":"ofenzauberer","title":"Knusprige Steinofen-Pizza","category":"Alles vom Stein","time":"14 Min (+ 60 Min Gehzeit)","temp":"240°C","portions":"1 Blech","ingredients":["350 g Weizenmehl Type 550","1/2 Pck. Trockenhefe (5 g)","210 ml lauwarmes Wasser","1 EL Olivenoel","6 g Salz","Belag: passierte Tomaten, Mozzarella, nach Wahl"],"steps":["Hefeteig kneten, 60 Min. gehen lassen.","Stein im Ofen bei 240°C mit aufheizen.","Teig duenn ausziehen, auf Backpapier legen.","Mit Tomaten bestreichen, belegen, Mozzarella darauf.","Mit dem Papier auf den heissen Stein ziehen.","14 Min. backen, mit frischem Basilikum servieren.","Tipp: Stein wirklich gut vorheizen. Variante: zweigeteilt mit verschiedenem Belag."]},{"id":2109,"product":"ofenzauberer","title":"Elsaesser Flammkuchen (Stein)","category":"Alles vom Stein","time":"15 Min (+ 20 Min Ruhezeit)","temp":"240°C","portions":"1 Blech","ingredients":["250 g Mehl","120 ml Wasser","2 EL Olivenoel","200 g Creme fraiche","100 g Schmand","2 Zwiebeln","150 g Speck","Salz, Pfeffer, Muskat"],"steps":["Mehl, Wasser, Oel und Salz zu einem glatten Teig kneten, 20 Min. ruhen.","Stein bei 240°C mit aufheizen.","Teig hauchduenn auf Backpapier ausrollen.","Creme fraiche und Schmand wuerzen, aufstreichen, Zwiebeln und Speck darauf.","Mit dem Papier auf den heissen Stein ziehen.","Ca. 15 Min. knusprig backen, sofort servieren.","Tipp: So duenn wie moeglich ausrollen. Suesse Variante: mit Apfelscheiben, Zimt und Creme fraiche."]},{"id":2110,"product":"ofenzauberer","title":"Pizza Bianca (Stein)","category":"Alles vom Stein","time":"15 Min (+ 60 Min Gehzeit)","temp":"240°C","portions":"1 Blech","ingredients":["350 g Weizenmehl Type 550","1/2 Pck. Trockenhefe (5 g)","210 ml lauwarmes Wasser","150 g Creme fraiche","150 g Mozzarella","2 duenne Kartoffeln","Rosmarin, Olivenoel, Salz"],"steps":["Hefeteig kneten, 60 Min. gehen lassen.","Stein bei 240°C mit aufheizen.","Teig duenn auf Backpapier ausziehen.","Mit Creme fraiche bestreichen, Kartoffelscheiben, Mozzarella und Rosmarin darauf.","Mit dem Papier auf den heissen Stein ziehen.","Ca. 15 Min. backen.","Tipp: Kartoffeln sehr duenn hobeln. Variante: mit Spinat und Ziegenkaese."]},{"id":2111,"product":"ofenzauberer","title":"Pizzastangen zum Dippen","category":"Alles vom Stein","time":"18 Min (+ 60 Min Gehzeit)","temp":"220°C","portions":"ca. 12 Stangen","ingredients":["400 g Weizenmehl Type 550","1 Pck. Trockenhefe (7 g)","240 ml lauwarmes Wasser","2 EL Olivenoel","8 g Salz","120 g Pizzasauce","150 g Kaese"],"steps":["Hefeteig kneten, 60 Min. gehen lassen.","Auf dem bemehlten Stein flach ausdruecken.","Mit Pizzasauce bestreichen, mit Kaese bestreuen.","Mit dem Pizzaroller in Stangen schneiden.","In den kalten Ofen, 18 Min. bei 220°C.","Mit einem Dip servieren.","Tipp: Kraeuterquark oder Tomatensauce zum Dippen. Variante: mit Salami oder Schinken."]},{"id":2112,"product":"ofenzauberer","title":"Mediterranes Ofengemuese","category":"Alles vom Stein","time":"35 Min","temp":"200°C","portions":"4 Portionen","ingredients":["1 Zucchini","2 Paprika","1 Aubergine","1 Zwiebel","200 g Kirschtomaten","4 EL Olivenoel","Knoblauch, Kraeuter, Salz, Pfeffer"],"steps":["Gemuese in mundgerechte Stuecke schneiden.","Mit Oel, Knoblauch und Gewuerzen vermengen.","Einlagig auf dem Stein verteilen.","In den Ofen, 35 Min. bei 200°C.","Nach der Haelfte einmal wenden.","Mit frischen Kraeutern servieren.","Tipp: Gemuese nicht zu eng legen. Variante: mit Kichererbsen als Hauptgericht."]},{"id":2113,"product":"ofenzauberer","title":"Ofen-Feta mit Tomaten","category":"Alles vom Stein","time":"25 Min","temp":"200°C","portions":"2-3 Portionen","ingredients":["200 g Feta","300 g Kirschtomaten","2 Knoblauchzehen","3 EL Olivenoel","Oregano, Pfeffer, Chili"],"steps":["Feta in die Mitte des Steins setzen.","Tomaten und Knoblauch rundherum verteilen.","Mit Olivenoel betraeufeln und wuerzen.","In den Ofen, 25 Min. bei 200°C.","Feta und Tomaten verruehren.","Mit frischem Brot servieren.","Tipp: Mit Nudeln vermengt wird daraus eine Pasta-Sauce. Variante: mit Paprika und Oliven."]},{"id":2114,"product":"ofenzauberer","title":"Knusprige Kartoffel-Wedges","category":"Alles vom Stein","time":"35 Min","temp":"220°C","portions":"3-4 Portionen","ingredients":["800 g festkochende Kartoffeln","4 EL Olivenoel","1 TL Paprikapulver","1 Knoblauchzehe","1 Zweig Rosmarin","Salz, Pfeffer"],"steps":["Kartoffeln in Spalten schneiden.","Mit Oel und Gewuerzen vermengen.","Einlagig auf dem Stein verteilen.","In den Ofen, 35 Min. bei 220°C.","Nach 20 Min. wenden.","Mit Kraeuterquark servieren.","Tipp: Spalten nicht ueberlappen lassen. Variante: die letzten 5 Min. mit Parmesan."]},{"id":2115,"product":"ofenzauberer","title":"Frikadellen vom Blech","category":"Alles vom Stein","time":"25 Min","temp":"200°C","portions":"ca. 12 Stueck","ingredients":["600 g gemischtes Hackfleisch","1 Ei","50 g Semmelbroesel","1 Zwiebel","1 EL Senf","Salz, Pfeffer, Paprika"],"steps":["Hackfleisch mit Ei, Broeseln, Zwiebel, Senf und Gewuerzen verkneten.","Ca. 12 Frikadellen formen.","Auf den leicht geoelten Stein setzen.","In den Ofen, 25 Min. bei 200°C.","Nach der Haelfte wenden.","Warm oder kalt servieren.","Tipp: Im Ofen spritzt nichts. Variante: als Mini-Buletten fuers Buffet."]},{"id":2116,"product":"ofenzauberer","title":"Gemuese-Halloumi-Blech","category":"Alles vom Stein","time":"25 Min","temp":"210°C","portions":"3-4 Portionen","ingredients":["2 Pck. Halloumi","2 Paprika","1 Zucchini","200 g Cherrytomaten","1 Zwiebel","3 EL Olivenoel","1 EL Honig","Paprika, Salz, Pfeffer"],"steps":["Gemuese in Stuecke schneiden, mit Oel und Gewuerzen vermengen.","Einlagig auf dem Stein verteilen.","In den Ofen, 15 Min. bei 210°C.","Halloumi in Scheiben dazwischen legen, mit Honig betraeufeln.","Weitere 10 Min. backen.","Mit frischer Minze servieren.","Tipp: Dazu Fladenbrot oder Couscous. Variante: mit Kichererbsen fuer mehr Biss."]},{"id":3001,"product":"ofenhexe-rund","title":"Cremige Bacon-Gnocchi","category":"Herzhaft","time":"25-30 Min","temp":"200°C O/U","portions":"4 Portionen","ingredients":["800 g Gnocchi (Kuehlregal)","150 g durchwachsener Speck","1 Zwiebel","1 Knoblauchzehe","200 g Sahne","100 ml Gemuesebruehe","100 g Frischkaese","1 Handvoll TK-Erbsen oder Spinat","100 g geriebener Kaese","Salz, Pfeffer, Muskat"],"steps":["Ofen vorheizen, Form duenn einfetten. Speck wuerfeln und knusprig auslassen, herausnehmen.","Zwiebel und Knoblauch fein wuerfeln und im Speckfett glasig duensten.","Sahne, Bruehe und Frischkaese einruehren, kurz aufkochen und kraeftig wuerzen.","Rohe Gnocchi mit den Erbsen in die Form geben, die Sosse darueber verteilen und durchmischen.","Mit Kaese und Speck bestreuen und backen, bis die Oberflaeche goldbraun blubbert.","Tipp: Die Gnocchi kommen roh in die Form und garen in der Sosse - so werden sie besonders cremig."]},{"id":3002,"product":"ofenhexe-rund","title":"Spaetzle-Schinken-Gratin","category":"Herzhaft","time":"25-30 Min","temp":"200°C O/U","portions":"4 Portionen","ingredients":["500 g gekochte Spaetzle","200 g gekochter Schinken","2 Zwiebeln","20 g Butter","3 Eier","200 g Sahne","100 ml Milch","150 g geriebener Bergkaese","Salz, Pfeffer, Muskat"],"steps":["Ofen vorheizen, Form fetten. Zwiebeln in Ringe schneiden und in Butter langsam goldbraun roesten.","Schinken in Streifen schneiden. Spaetzle, Schinken und die Haelfte des Kaeses in der Form vermengen.","Eier mit Sahne und Milch verquirlen, kraeftig mit Muskat wuerzen und daruebergiessen.","Mit restlichem Kaese bestreuen und backen, bis der Guss gestockt und goldgelb ist.","Zum Schluss die Roestzwiebeln darueberstreuen und sofort servieren.","Tipp: Frische Spaetzle schmecken am besten - Reste vom Vortag gehen aber genauso gut."]},{"id":3003,"product":"ofenhexe-rund","title":"Nudelauflauf nach Familienart","category":"Herzhaft","time":"25 Min","temp":"200°C O/U","portions":"4-6 Portionen","ingredients":["400 g kurze Nudeln","400 g gemischtes Hackfleisch","1 Zwiebel","1 Knoblauchzehe","1 Dose stueckige Tomaten","2 EL Tomatenmark","200 g Schmand","150 g geriebener Kaese","Salz, Pfeffer, Paprika","1 TL italienische Kraeuter"],"steps":["Nudeln bissfest kochen und abgiessen. Ofen vorheizen, Form fetten.","Hack mit Zwiebel und Knoblauch kruemelig anbraten, Tomatenmark kurz mitroesten.","Stueckige Tomaten zugeben, wuerzen und einige Minuten koecheln.","Nudeln und Sauce mischen, in die Form fuellen und mit Schmandklecksen und Kaese bedecken.","Backen, bis der Kaese goldbraun und die Raender leicht knusprig sind.","Tipp: Eine Handvoll Erbsen oder Paprika unter die Sauce mischt nebenbei Gemuese unter."]},{"id":3004,"product":"ofenhexe-rund","title":"Ofen-Feta mit geschmorten Tomaten","category":"Herzhaft","time":"25-30 Min","temp":"200°C O/U","portions":"4 als Vorspeise","ingredients":["400 g Cherrytomaten","200 g Feta am Stueck","3 EL Olivenoel","2 Knoblauchzehen","1 TL Honig","je 1 TL Oregano & Thymian","1 Prise Chiliflocken","Salz, Pfeffer","Baguette zum Dippen"],"steps":["Ofen vorheizen. Tomaten in die Form geben, den Feta in die Mitte setzen.","Knoblauch andruecken, mit Oel, Honig, Kraeutern und Chili ueber Tomaten und Kaese verteilen.","Mit Salz und Pfeffer wuerzen und backen, bis die Tomaten aufplatzen und der Feta weich ist.","Alles mit einer Gabel zu einer groben Sauce verruehren und sofort mit Brot servieren.","Tipp: Mit kurzen Nudeln vermengt wird daraus im Handumdrehen ein Abendessen."]},{"id":3005,"product":"ofenhexe-rund","title":"Zucchini-Hack-Roellchen in Tomatensugo","category":"Herzhaft","time":"30 Min","temp":"200°C O/U","portions":"4 Portionen","ingredients":["2 grosse Zucchini","400 g Hackfleisch","1 Zwiebel","1 Ei","2 EL Semmelbroesel","Sugo: 1 Dose stueckige Tomaten, 1 EL Tomatenmark, 1 Knoblauchzehe","125 g Mozzarella","Salz, Pfeffer, Paprika"],"steps":["Zucchini laengs in duenne Scheiben hobeln, leicht salzen, ziehen lassen und trocken tupfen.","Hack mit Zwiebel, Ei, Semmelbroeseln, Salz, Pfeffer und Paprika verkneten.","Etwas Fuellung auf jede Zucchinischeibe geben und aufrollen.","Tomaten, Mark und Knoblauch wuerzen, in die gefettete Form geben und die Roellchen daraufsetzen.","Mit Mozzarella belegen und backen, bis das Sugo koechelt und der Kaese goldbraun ist.","Tipp: Ein Schuss Sahne ins Sugo macht die Sauce besonders samtig."]},{"id":3006,"product":"ofenhexe-rund","title":"Tortilla-Lasagne","category":"Herzhaft","time":"25 Min","temp":"200°C O/U","portions":"4-6 Portionen","ingredients":["6 Weizentortillas","500 g Hackfleisch","1 Zwiebel","1 Paprika","1 Dose Mais","1 Dose Kidneybohnen","1 Dose stueckige Tomaten","1 Pck. Taco-Gewuerz","200 g Schmand","200 g geriebener Kaese"],"steps":["Hack mit Zwiebel und gewuerfelter Paprika anbraten. Mais, abgespuelte Bohnen und Tomaten zugeben.","Mit dem Taco-Gewuerz abschmecken und einige Minuten einkochen lassen.","In die gefettete Form abwechselnd Tortilla, Fuellung, Schmand und Kaese schichten.","Tortillas passend zuschneiden, mit einer Kaeseschicht abschliessen.","Backen, bis der Kaese zerlaufen und goldbraun ist. Vor dem Anschneiden kurz ruhen lassen.","Tipp: Fruehlingszwiebeln und ein Klecks Guacamole obendrauf bringen Frische."]},{"id":3007,"product":"ofenhexe-rund","title":"Apfelkuchen mit Knusperstreuseln","category":"Suess","time":"45-50 Min","temp":"180°C O/U","portions":"1 Form","ingredients":["Teig: 200 g Mehl, 100 g Zucker, 100 g Butter, 1 Ei, 1 TL Backpulver","Belag: 4-5 Aepfel, 1 TL Zimt","Streusel: 150 g Mehl, 100 g Butter, 80 g Zucker"],"steps":["Aus den Teigzutaten einen glatten Muerbeteig kneten und in die gefettete Form druecken, einen kleinen Rand hochziehen.","Aepfel schaelen, in Spalten schneiden, mit Zimt und etwas Zucker mischen und auf dem Teig verteilen.","Fuer die Streusel Mehl, Butter, Zucker und eine Prise Zimt zu groben Broeseln verkneten.","Streusel ueber die Aepfel geben und backen, bis sie goldbraun sind (Staebchenprobe).","In der Form auskuehlen lassen und nach Belieben mit Puderzucker bestaeuben.","Tipp: Saeuerliche Aepfel wie Boskoop geben den schoensten Kontrast zu den suessen Streuseln."]},{"id":3008,"product":"ofenhexe-rund","title":"Kaesekuchen, der nicht einfaellt","category":"Suess","time":"70-80 Min","temp":"160°C O/U","portions":"1 Form","ingredients":["Boden: 150 g Mehl, 60 g Zucker, 75 g Butter, 1 Ei","Fuellung: 1 kg Magerquark, 200 g Zucker, 4 Eier, 1 Pck. Vanillepuddingpulver, 100 g weiche Butter, 200 ml Milch, 1 Zitronenabrieb"],"steps":["Boden-Zutaten zu Muerbeteig verkneten, in die gefettete Form druecken und einen Rand hochziehen.","Alle Fuellungs-Zutaten glatt verruehren, bis keine Kluempchen mehr da sind.","Masse auf den Boden giessen und glattstreichen.","Bei niedriger Temperatur backen, bis die Mitte nur noch leicht wackelt.","Ofen ausschalten und den Kuchen bei einen Spalt geoeffneter Tuer darin auskuehlen lassen.","Tipp: Niedrige Hitze und langsames Abkuehlen verhindern Risse und Einfallen - Geduld ist die wichtigste Zutat."]},{"id":3009,"product":"ofenhexe-rund","title":"Russischer Zupfkuchen (runde Form)","category":"Suess","time":"55-60 Min","temp":"175°C O/U","portions":"1 Form","ingredients":["Teig: 250 g Mehl, 50 g Kakao, 100 g Zucker, 125 g Butter, 1 Ei, 1 TL Backpulver","Fuellung: 500 g Quark, 150 g Zucker, 3 Eier, 1 Pck. Vanillepuddingpulver, 100 g weiche Butter"],"steps":["Aus den Teigzutaten einen Muerbeteig kneten und kurz kalt stellen.","Zwei Drittel des Teigs als Boden mit Rand in die gefettete Form druecken.","Fuellungs-Zutaten glatt ruehren und auf den Boden geben.","Restlichen Teig in Stuecken zupfen und auf der Fuellung verteilen.","Backen, bis die Fuellung gestockt ist, und in der Form auskuehlen lassen.","Tipp: Den Teig nicht zu lange kneten - sonst wird er beim Zupfen kruemelig."]},{"id":3010,"product":"ofenhexe-rund","title":"Zwetschgen-Streusel-Ruehrkuchen","category":"Suess","time":"45 Min","temp":"180°C O/U","portions":"1 Form","ingredients":["Ruehrteig: 200 g weiche Butter, 150 g Zucker, 3 Eier, 250 g Mehl, 1 Pck. Backpulver","Belag: 600 g Zwetschgen","Streusel: 120 g Mehl, 80 g Butter, 70 g Zucker"],"steps":["Butter und Zucker schaumig ruehren, Eier einzeln zugeben, Mehl mit Backpulver unterheben.","Teig in die gefettete Form streichen.","Zwetschgen entsteinen, halbieren und dicht an dicht auf dem Teig verteilen.","Aus Mehl, Butter und Zucker Streusel kneten und darueberbroeseln.","Backen, bis die Streusel goldbraun sind (Staebchenprobe), und auskuehlen lassen.","Tipp: Eine Prise Zimt im Teig und etwas Marzipan zwischen den Zwetschgen machen ihn herbstlich rund."]},{"id":3011,"product":"ofenhexe-rund","title":"Obst-Schmandkuchen","category":"Suess","time":"40-45 Min","temp":"175°C O/U","portions":"1 Form","ingredients":["Boden: 100 g Butter, 80 g Zucker, 2 Eier, 150 g Mehl, 1 TL Backpulver","Belag: 400 g Obst (Beeren, Pfirsich)","Guss: 400 g Schmand, 2 Eier, 80 g Zucker, 1 EL Speisestaerke"],"steps":["Boden-Zutaten zu einem Ruehrteig verruehren und duenn in die gefettete Form streichen.","Obst abtropfen lassen und auf dem Teig verteilen.","Fuer den Guss Schmand, Eier, Zucker, Vanille und Staerke glatt ruehren.","Guss ueber das Obst giessen und backen, bis die Oberflaeche gerade eben fest ist.","Vollstaendig auskuehlen lassen - der Guss festigt sich beim Abkuehlen.","Tipp: TK-Beeren vorher leicht antauen und abtropfen, damit der Kuchen nicht waessrig wird."]},{"id":3012,"product":"ofenhexe-rund","title":"Zimtschnecken-Kuchen","category":"Suess","time":"25-30 Min","temp":"180°C O/U","portions":"1 Form","ingredients":["Hefeteig: 400 g Mehl, 1 Pck. Trockenhefe, 200 ml warme Milch, 60 g Zucker, 60 g Butter, 1 Ei","Fuellung: 80 g weiche Butter, 80 g brauner Zucker, 2 TL Zimt","Guss: 100 g Frischkaese, 80 g Puderzucker"],"steps":["Aus Mehl, Hefe, Milch, Zucker, Butter und Ei einen glatten Teig kneten und gehen lassen, bis er sich verdoppelt hat.","Teig rechteckig ausrollen, mit weicher Butter bestreichen und mit Zucker-Zimt bestreuen.","Von der langen Seite aufrollen und in etwa 12 Scheiben schneiden.","Schnecken in die gefettete Form setzen, kurz nachgehen lassen und backen, bis sie goldbraun sind.","Frischkaese mit Puderzucker verruehren und den noch warmen Kuchen damit ueberziehen.","Tipp: Die Schnecken duerfen sich fast beruehren - beim Gehen wachsen sie zu einem saftigen Kranz zusammen."]},{"id":5001,"product":"ofenmeister","title":"Kasseler im Ofenmeister","category":"Fleisch","time":"90 Min","temp":"230°C → 200°C","portions":"4","ingredients":["1 kg Kasseler-Lachs","3 Möhren in Scheiben","2 Zwiebeln in Achtel","2–4 Lorbeerblätter","600 ml Gemüsebrühe","2 EL Tomatenmark","1 TL Senf","1 TL Paprikapulver edelsüß","Salz/Pfeffer"],"steps":["Backofen auf 230°C vorheizen","Ofenmeister mit Butterschmalz einfetten","Möhren, Zwiebeln und Lorbeer einlegen","Soße aus Brühe, Tomatenmark, Senf, Paprika anrühren, über Gemüse geben","Kasseler darauflegen, Deckel drauf","80 Min. bei 230°C backen","Auf 200°C reduzieren, 10 Min. OHNE Deckel","Fleisch herausnehmen, Sud durch Sieb – Soße ggf. andicken"]},{"id":5002,"product":"ofenmeister","title":"Pulled Pork","category":"Fleisch","time":"7 Std","temp":"150°C","portions":"4","ingredients":["2,5 kg Nackenbraten (ohne Knochen)","100 ml Apfelsaft","3–4 Zwiebeln","4 EL Senf","250 ml BBQ-Sauce","BBQ-Gewürz z.B. Magic Dust"],"steps":["Nackenbraten mit Senf, dann BBQ-Gewürz einreiben","Zwiebeln kleinschneiden, als Bett in Ofenmeister legen","Apfelsaft und BBQ-Sauce mischen, über Zwiebeln gießen","Braten auflegen, Deckel drauf","3 Std. bei 150°C garen, wenden, weitere 4 Std. garen","Garflüssigkeit abgießen (als Sauce aufheben)","Pulled Pork direkt im Ofenmeister auseinanderzupfen"]},{"id":5003,"product":"ofenmeister","title":"Rinderrouladen","category":"Fleisch","time":"2–2,5 Std","temp":"200°C","portions":"4","ingredients":["4 Rinderrouladen","Salz, Pfeffer, Paprika","4 EL Senf (mittelscharf)","80 g Speck- oder Schinkenwürfel","4 Gewürzgurken in Scheiben","2 Zwiebeln","Suppengemüse (Möhren, Sellerie, Porree)","500 ml Rinderbrühe oder -fond","150 ml Rotwein","2 EL Tomatenmark","1 EL Balsamico dunkel","1 EL Preiselbeermarmelade","2 Lorbeerblätter","Speisestärke zum Binden","Butterschmalz für die Form"],"steps":["Ofen auf 200°C Ober-/Unterhitze vorheizen","Suppengemüse und Zwiebeln würfeln, in gefetteten Ofenmeister geben","Rouladen flach klopfen, salzen, pfeffern, mit Senf bestreichen","Mit Speck, Zwiebelwürfeln und Gurke belegen, von der breiten Seite aufrollen und fixieren","Rouladen mit der Naht nach unten auf das Gemüse legen – kein Anbraten nötig!","Fond, Rotwein, Tomatenmark, Balsamico, Preiselbeeren und Lorbeer verrühren, darübergießen","Deckel drauf, auf unterster Schiene 2–2,5 Std. schmoren","Rouladen herausnehmen, Soße pürieren, mit Stärke binden","Tipp: Kartoffeln gleichzeitig in der Lilly garen"]},{"id":5004,"product":"ofenmeister","title":"Rinderbraten / Schmorbraten","category":"Fleisch","time":"2,5–3 Std","temp":"200°C","portions":"4","ingredients":["1,2–1,5 kg Rinderbraten (z.B. Schulter)","3–4 Knoblauchzehen","Salz, Pfeffer","200 ml passierte Tomaten","2 EL Essig","1 EL brauner Zucker","1 EL Worcestershire-Sauce","1 EL Senf","2 große Gemüsezwiebeln, dünn gehobelt","Butterschmalz für die Form"],"steps":["Ofenmeister einfetten, Fleisch hineingeben","Knoblauch durchpressen, Fleisch einreiben, kräftig salzen und pfeffern","Tomaten, Essig, Zucker, Worcestershire und Senf verrühren, über das Fleisch geben","Zwiebelringe auf und um das Fleisch verteilen","Deckel drauf, ca. 2,5–3 Std. bei 200°C schmoren","Nach halber Garzeit Fleisch wenden","Fleisch herausnehmen, kurz ruhen lassen, aufschneiden","Sauce mit Zwiebeln servieren – passt zu Kartoffeln, Klößen und Rotkohl"]},{"id":5005,"product":"ofenmeister","title":"Ofengulasch","category":"Fleisch","time":"2,5 Std","temp":"230°C → 220°C","portions":"4","ingredients":["1 kg Gulaschfleisch (Rind oder Schwein)","2 EL Tomatenmark","Salz, Pfeffer, 1 TL Zucker","1 TL Paprika edelsüß","1 TL Paprika geräuchert","2 EL Olivenöl","1 EL Essig","2 Zwiebeln in Stücken","400 g Kartoffeln in Würfeln","400 ml Rinderbrühe","150 ml Rotwein (oder Traubensaft)","2 Lorbeerblätter","Butterschmalz für die Form"],"steps":["Fleisch mind. 1 Std. vorher mit Tomatenmark, Salz, Pfeffer, Zucker, Paprika, Öl und Essig marinieren","Ofenmeister einfetten, mariniertes Fleisch, Zwiebeln und Kartoffeln hineingeben","Brühe, Rotwein und Lorbeer darübergeben","Ofen auf 230°C vorheizen, Ofenmeister mit Deckel auf unterster Schiene einschieben","Nach 1 Std. Temperatur auf 220°C reduzieren, weitere 1,5 Std. schmoren – nicht umrühren!","Lorbeerblätter entfernen, abschmecken, servieren"]},{"id":5006,"product":"ofenmeister","title":"One Pot Hähnchen Nudelauflauf","category":"Geflügel","time":"60 Min","temp":"230°C","portions":"4","ingredients":["350 g Nudeln","150 g Blattspinat","1 rote Zwiebel","600 g Hähnchenbrustfilet","250 g Cocktailtomaten","1 TL Paprika edelsüß","Pfeffer und Salz","250 ml Gemüsebrühe","1 Becher Sahne","60 g Parmesan"],"steps":["Backofen auf 230°C vorheizen","Hähnchen würzen und in Stücke schneiden","Nudeln in gefetteten Ofenmeister geben, Spinat, Tomaten und Zwiebel dazu","Brühe, Sahne und Parmesan verrühren, würzen, über Nudeln geben","Hähnchen obendrauf verteilen","Mit Deckel 60 Min. backen"]},{"id":5007,"product":"ofenmeister","title":"Erdnuss-Curry","category":"Geflügel","time":"60–70 Min","temp":"230°C","portions":"4","ingredients":["1 Zwiebel in Würfel","400 g Süßkartoffeln in Würfel","500 g Hähnchenbrust in Würfel","400 g Kokosmilch","200 ml Wasser","250 g passierte Tomaten","2 EL Currypaste","50 g Erdnussmus","50 g Erdnussbutter","2 EL Salz","Handvoll gesalzene Erdnüsse","Koriander","Stärke zum Andicken"],"steps":["Ofenmeister fetten, alle Würfel hineingeben","Sauce aus restlichen Zutaten rühren, darübergeben, verrühren","Deckel drauf, auf unterster Schiene 60 Min. bei 230°C","Sauce mit Stärke andicken","Mit Erdnüssen und Koriander servieren – Langkornreis passt perfekt"]},{"id":5008,"product":"ofenmeister","title":"One Pott Hähnchen","category":"Geflügel","time":"65–70 Min","temp":"250°C","portions":"4","ingredients":["1 ganzes gewürztes Hähnchen","2 Möhren","Kartoffeln nach Bedarf"],"steps":["Ofen auf 250°C vorheizen","Möhren halbieren, in Ofenmeister legen (Hähnchen liegt erhöht, schwimmt nicht im Saft)","Gewürztes Hähnchen darauflegen, Kartoffeln mitgeben","Ca. 55 Min. mit Deckel im Ofen","Deckel abnehmen, 10–15 Min. knusprig grillen"]},{"id":5009,"product":"ofenmeister","title":"Lachs auf Ofengemüse","category":"Fisch","time":"35–40 Min","temp":"200°C","portions":"4","ingredients":["4 Lachsfilets (je ca. 150 g, frisch oder TK aufgetaut)","1 Zucchini in Scheiben","1 Paprika in Streifen","2 Möhren in Scheiben","1 Zwiebel in Ringen","2 Handvoll Kirschtomaten","2–3 Knoblauchzehen","3 EL Olivenöl","1 EL Zitronensaft","Salz, Pfeffer","1 TL Paprikapulver","1 TL Oregano oder Provenzalische Kräuter","Optional: etwas Schafskäse und Pinienkerne"],"steps":["Backofen auf 200°C Ober-/Unterhitze vorheizen","Gemüse und Knoblauch waschen, putzen und kleinschneiden","Mit Olivenöl, Salz, Pfeffer, Paprika und Kräutern vermengen","In den gefetteten Ofenmeister geben","15 Min. im Ofen vorgaren","Lachs trocken tupfen, mit Zitronensaft beträufeln, salzen und pfeffern","Lachs auf das Gemüse legen, Deckel drauf","Weitere 15–20 Min. garen, bis Lachs gar ist","Optional: 5 Min. vor Ende Schafskäse und Pinienkerne darübergeben"]},{"id":5010,"product":"lilly","title":"Gemüsecurry mit Mienudeln","category":"Vegetarisch","time":"35–40 Min","temp":"230°C","portions":"2","ingredients":["1 kleine Paprika","1 kleine Zucchini","1 kleine rote Zwiebel","2 kleine Möhren","85 g Mienudeln","150 ml Kokosmilch","1 TL Honig","½ TL Salz","1 EL Currypaste","etwas frischer Ingwer","400 ml Gemüsebrühe"],"steps":["Backofen auf 230°C vorheizen","Gemüse mit Mandoline in Streifen/Scheiben schneiden","Restliche Zutaten zu einer Sauce anrühren","Mienudeln in die gefettete Lilly geben, Gemüse darauf verteilen","Mit Sauce übergießen, function calcStonewareRecipe(){
 const txt = document.getElementById("recipeCalc")?.value?.trim();
 const fromId = document.getElementById("convertFrom")?.value;
 const toId   = document.getElementById("convertTo")?.value;

 if(!txt){
   alert("Bitte zuerst ein Rezept oder die Zutaten eintippen.");
   return;
 }

 const sizeFrom = productSizes[fromId] || 1;
 const sizeTo   = productSizes[toId]   || 1;
 const factor   = sizeTo / sizeFrom;

 const fromLabel = products.find(p=>p.id===fromId)?.label || fromId;
 const toLabel   = products.find(p=>p.id===toId)?.label   || toId;

 const lines = txt.split("\n").filter(Boolean);

 const out = lines.map(line=>{
   return line.replace(/(\d+[,.]?\d*)\s*(g|kg|ml|l|EL|TL|Stueck|Stück|Dose|Dosen|Pck\.?|Becher)?/gi,(m,num,unit="",offset,str)=>{
     const val = parseFloat(num.replace(",","."));
     if(!Number.isFinite(val)) return m;
     const before = String(str).slice(0,offset).toLowerCase();
     if(!unit && /(mehl|dinkel|weizen|roggen|emmer|einkorn|vollkorn|type|typ)\s*$/.test(before)) return m;
     const u = unit.toLowerCase();
     let scaled = val * factor;
     scaled = (u==="kg" || u==="l") ? Math.round(scaled*100)/100 : Math.round(scaled*10)/10;
     return `${String(scaled).replace(".",",")}${unit?" "+unit:(m.length>num.length?" ":"")}`;
   });
 });

 const factorPretty = Math.round(factor*100)/100;
 const factorTxt = factorPretty === 1
   ? "Mengen bleiben gleich (etwa selbe Groesse)"
   : `Faktor: ${String(factorPretty).replace(".",",")}x`;

 document.getElementById("conversionFactor").innerHTML =
   `<div class="conversion-info">${fromLabel} → ${toLabel} · ${factorTxt}</div>`;

 document.getElementById("recipeOut").innerHTML =
   `<div style="background:#FFF8FB;border:1px solid #E8D5DC;border-radius:16px;padding:14px">
     <strong>Umgerechnetes Rezept</strong>
     ${out.map(x=>`<div style="padding:8px 0;border-bottom:1px solid #f0e4ea">${x}</div>`).join("")}
     <button class="btn full" style="margin-top:12px" onclick='addConvertedToShopping(window.lastConvertedItems.join("|"))'>Zur Einkaufsliste hinzufuegen</button>
   </div>`;

 window.lastConvertedItems = out;
}

function addConvertedToShopping(text){
const items=text.split("|");
items.forEach(x=>shoppingItems.push({text:x,done:false}));
localStorage.setItem("shopping-items",JSON.stringify(shoppingItems));
alert("Zur Einkaufsliste hinzugefügt ✓");
}

const productSizes = {

let _importSaving = false;
function saveImport(){
 if(_importSaving) return; // Schutz gegen Mehrfach-Klick
 const text=document.getElementById("importText").value.trim();
 const title=document.getElementById("importTitle").value.trim()||"Eigenes Rezept";
 const product=document.getElementById("importProduct").value;
 if(!text){ alert("Bitte zuerst einen Screenshot hochladen oder Rezepttext einfuegen."); return; }

 if(btn){ btn.textContent = "Wird gespeichert …"; btn.style.opacity = "0.6"; }

 const lines=text.split(/\n/).map(x=>x.trim()).filter(Boolean);
 // Zutat = beginnt mit Menge + Einheit (g, ml, EL ...). Nummerierte Schritte (1. / 1)) zaehlen NICHT als Zutat.
 const isIngredient = l =>
   /^(½|¼|¾|⅓|⅔|\d+([.,]\d+)?)\s*(g|kg|ml|l|el|tl|stk|stueck|stück|prise|prisen|pck|packung|dose|dosen|becher|tasse|bund|zehe|zehen|scheibe|scheiben)\b/i.test(l)
   && !/^\d+[.)]\s/.test(l);
 const ing = lines.filter(isIngredient).slice(0,40);
 const steps = lines.filter(l=>!isIngredient(l)).slice(1,60);

 state.custom.push({id:Date.now(),product,title,category:"Import",time:"",temp:"",portions:"",ingredients:ing.length?ing:["Bitte Zutaten pruefen"],steps:steps.length?steps:["Bitte Zubereitung pruefen"]});

 showTab(product);
 showToast(`✓ Rezept "${title}" gespeichert.`);
 setTimeout(()=>{ _importSaving = false; }, 800);
}

window.stonewareTimer = window.stonewareTimer || {

function timerSet(seconds){
 const t = window.stonewareTimer;
 if(t.interval){clearInterval(t.interval); t.interval=null;}

}

function timerSetCustom(){
 const inp = document.getElementById("timerCustomMin");
 if(!inp) return;

 if(!Number.isFinite(min) || min <= 0){
   alert("Bitte eine Zahl groesser als 0 eingeben.");
   return;
 }
 timerSet(min * 60);
