<title>Stoneware App · Grundstock Rezepte</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<style>
:root{--bg:#F7F0F3;--card:#fff;--cream:#FFF8FB;--text:#351E29;--mid:#6B3F54;--soft:#9E7080;--mauve:#9B5E74;--dark:#6B2E44;--light:#C4899E;--xl:#EDD5DE;--border:#E8D5DC;--green:#4A7A5A;--amber:#B87840;--blue:#5A7BB5}
*{box-sizing:border-box} body{margin:0;background:linear-gradient(160deg,#F7F0F3,#FFF8FB);font-family:Nunito,system-ui,sans-serif;color:var(--text)} button,input,select,textarea{font:inherit} button{cursor:pointer}
.app{min-height:100vh;padding-bottom:80px} .header{position:sticky;top:0;z-index:50;background:linear-gradient(135deg,var(--dark),var(--mauve));color:white;padding:calc(14px + env(safe-area-inset-top,0px)) 14px 0;box-shadow:0 8px 30px rgba(107,46,68,.25)} .head-inner{max-width:980px;margin:auto} .brand{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px} .brand h1{font-family:Cormorant Garamond,serif;margin:0;font-size:24px;line-height:1;font-weight:700} .brand p{margin:2px 0 0;color:rgba(255,255,255,.55);font-size:11px;letter-spacing:1.4px;text-transform:uppercase}
.tabs{display:flex;gap:5px;overflow-x:auto;scrollbar-width:none} .tabs::-webkit-scrollbar{display:none} .tab{white-space:nowrap;border:0;border-radius:12px 12px 0 0;padding:10px 13px;background:transparent;color:rgba(255,255,255,.7);font-size:13px;font-weight:800} .tab.active{background:var(--bg);color:var(--dark)} .wrap{max-width:980px;margin:auto;padding:18px 14px}
.hero{border-radius:26px;padding:26px 22px;background:linear-gradient(135deg,var(--dark),var(--mauve) 58%,var(--light));color:white;box-shadow:0 18px 44px rgba(107,46,68,.24);overflow:hidden;position:relative;margin-bottom:16px} .hero:before{content:"";position:absolute;right:-90px;top:-90px;width:260px;height:260px;border-radius:50%;background:rgba(255,255,255,.09)} .kicker{font-size:11px;letter-spacing:2.6px;text-transform:uppercase;color:rgba(255,255,255,.58);font-weight:900;margin:0 0 8px} .hero h2{font-family:Cormorant Garamond,serif;font-size:clamp(30px,8vw,48px);line-height:.98;margin:0 0 12px;font-weight:700;position:relative} .hero p{margin:0;font-size:14px;line-height:1.7;color:rgba(255,255,255,.78);max-width:620px;position:relative}
.grid{display:grid;gap:14px} .grid.two{grid-template-columns:repeat(2,minmax(0,1fr))} .grid.three{grid-template-columns:repeat(3,minmax(0,1fr))} @media(max-width:740px){.grid.two,.grid.three{grid-template-columns:1fr}.brand h1{font-size:21px}.wrap{padding:14px 12px}.hero{padding:24px 18px}}
.card{background:var(--card);border:1px solid var(--border);border-radius:22px;padding:17px;box-shadow:0 8px 26px rgba(107,46,68,.08)} .card h3{font-family:Cormorant Garamond,serif;margin:0 0 8px;font-size:24px;line-height:1.05} .card p{margin:0;color:var(--mid);font-size:13.5px;line-height:1.65} .notice{background:#FBF4EB;border:2px solid #DDB87A;border-radius:18px;padding:15px;display:flex;gap:12px;align-items:flex-start;margin-bottom:16px} .notice p{margin:0;color:var(--mid);line-height:1.6;font-size:13.5px}
.btn{border:0;border-radius:999px;padding:12px 16px;font-weight:900;font-size:13px;background:linear-gradient(135deg,var(--mauve),var(--dark));color:white;box-shadow:0 8px 20px rgba(107,46,68,.18)} .btn.secondary{background:white;color:var(--dark);border:1px solid var(--border);box-shadow:none} .btn.blue{background:linear-gradient(135deg,var(--blue),var(--mauve))} .btn.full{width:100%}
.searchbar{display:flex;gap:8px;position:sticky;top:calc(98px + env(safe-area-inset-top,0px));z-index:30;background:rgba(247,240,243,.94);backdrop-filter:blur(8px);padding:10px 0;margin-bottom:12px} .searchbar input,.field,input,select,textarea{width:100%;border:1px solid var(--border);border-radius:14px;background:white;color:var(--text);padding:12px 13px;outline:none} .chips{display:flex;gap:7px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:none} .chips::-webkit-scrollbar{display:none} .chip{white-space:nowrap;border:0;border-radius:999px;padding:8px 12px;background:var(--xl);color:var(--dark);font-size:12px;font-weight:900} .chip.active{background:var(--dark);color:white}
.recipe{position:relative;overflow:hidden} .recipe:before{content:"";position:absolute;left:0;top:0;right:0;height:5px;background:linear-gradient(90deg,var(--mauve),var(--light))} .meta{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 10px} .pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;background:var(--xl);color:var(--dark);padding:4px 9px;font-size:11px;font-weight:900} .recipe h3{font-size:20px;margin-top:6px} .product-icon{height:120px;border-radius:28px;background:linear-gradient(135deg,var(--xl),white);display:flex;align-items:center;justify-content:center;font-size:54px;border:1px solid var(--border)} .fav{position:absolute;right:14px;top:13px;border:0;background:white;color:var(--mauve);width:36px;height:36px;border-radius:50%;box-shadow:0 4px 14px rgba(107,46,68,.12);font-size:18px} .fav.on{background:var(--mauve);color:white}
.modal{position:fixed;inset:0;background:rgba(58,31,42,.72);z-index:1000;display:flex;align-items:flex-start;justify-content:center;padding:12px;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain} .modal-box{position:relative;background:var(--cream);border-radius:26px;width:100%;max-width:820px;margin:0 auto;box-shadow:0 28px 70px rgba(58,31,42,.32)} .modal-head{background:linear-gradient(135deg,var(--dark),var(--mauve));color:white;padding:22px;border-radius:26px 26px 0 0;position:sticky;top:0;z-index:2} .close{position:absolute;right:14px;top:14px;border:0;background:rgba(255,255,255,.28);color:white;border-radius:50%;width:42px;height:42px;font-size:24px;line-height:1;z-index:10;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation;display:flex;align-items:center;justify-content:center} .modal-body{padding:18px} .list{margin:0;padding:0;list-style:none} .list li{padding:8px 0;border-bottom:1px solid var(--border);display:flex;gap:8px;color:var(--mid);font-size:13.5px;line-height:1.55} .num{background:var(--mauve);color:white;border-radius:50%;width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;font-size:11px;font-weight:900}
.tool-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px} @media(max-width:560px){.tool-row{grid-template-columns:1fr}.searchbar{top:calc(92px + env(safe-area-inset-top,0px))}.modal{padding:0;align-items:flex-start}.modal-box{border-radius:0;min-height:100%;margin:0}.modal-head{border-radius:0;padding-top:calc(22px + env(safe-area-inset-top,0px))}.close{top:calc(14px + env(safe-area-inset-top,0px))}.modal-body{padding:14px}}
.export-card{position:absolute;left:-9999px;top:0;width:1080px;height:1350px;background:linear-gradient(160deg,#FFF8FB,#F7EDF2 55%,#EED8E2);padding:78px;font-family:Nunito,sans-serif;color:var(--text)} .export-card.story{height:1920px;padding:110px 86px} .export-title{font-family:Cormorant Garamond,serif;font-size:76px;line-height:.98;font-weight:700;color:var(--text);margin:40px 0 22px} .export-card.story .export-title{font-size:92px} .small{font-size:12px;color:var(--soft);line-height:1.55} .footer-note{text-align:center;margin:26px 0;color:var(--soft);font-size:12px}

.product-real-img{
 width:100%;
 height:170px;
 object-fit:cover;
 border-radius:26px;
 display:block;
 background:#f7f2f4;
 box-shadow:0 10px 30px rgba(0,0,0,.12);
}
.product-wrap{
 position:relative;
}
.product-badge{
 position:absolute;
 left:12px;
 bottom:12px;
 background:rgba(255,255,255,.85);
 backdrop-filter:blur(10px);
 padding:6px 12px;
 border-radius:999px;
 font-weight:700;
 color:#6B2E44;
}

/* === Tools-Tab: Hinweise & Shop-Buttons === */
.product-tip{background:#FBF4EB;border:1px solid #DDB87A;border-radius:14px;padding:10px 12px;display:flex;gap:9px;align-items:flex-start;margin-top:12px;font-size:12.5px;color:var(--mid);line-height:1.55}
.product-tip-icon{font-size:18px;line-height:1;flex-shrink:0}
.btn-shop{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:999px;padding:11px 16px;font-weight:900;font-size:12.5px;background:linear-gradient(135deg,var(--mauve),var(--dark));color:white;text-decoration:none;box-shadow:0 8px 20px rgba(107,46,68,.18);margin-top:12px;width:100%;box-sizing:border-box;cursor:pointer}
.btn-shop:active{transform:scale(.98)}
.conversion-info{background:linear-gradient(135deg,var(--xl),#FFF8FB);border:1px solid var(--border);border-radius:14px;padding:11px 14px;margin-top:12px;font-size:13px;color:var(--dark);font-weight:700;text-align:center}
.product-mini{display:flex;gap:12px;align-items:center;margin-bottom:8px}
.product-mini img{width:54px;height:54px;object-fit:cover;border-radius:14px;flex-shrink:0;box-shadow:0 4px 12px rgba(107,46,68,.12)}
.product-mini h3{margin:0;font-size:20px;line-height:1.1}

/* === Timer === */
.timer-display{font-family:Cormorant Garamond,Playfair Display,serif;font-weight:700;font-size:84px;text-align:center;letter-spacing:-3px;background:linear-gradient(135deg,var(--dark),var(--mauve));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:var(--dark);line-height:1;margin:18px 0 6px;font-variant-numeric:tabular-nums}
.timer-display.finished{animation:timerFlash 0.7s ease-in-out 3}
@keyframes timerFlash{0%,100%{opacity:1}50%{opacity:0.3}}
.timer-status{text-align:center;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;color:var(--mid);margin:0 0 14px}
.timer-status.running{color:var(--mauve)}
.timer-presets{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-bottom:10px}
.timer-presets .chip{flex:0 0 auto;font-size:13px;padding:8px 14px}
.timer-controls{display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px;margin-top:12px}
.timer-controls .btn{width:100%;padding:13px 10px;font-size:13.5px}

/* === Import CTA (Screenshot -> Rezept) === */
.import-cta{background:linear-gradient(135deg,#FFF8FB,#F7E8EF);border:2px dashed var(--mauve);border-radius:20px;padding:18px 20px;display:flex;gap:14px;align-items:center;cursor:pointer;transition:transform .15s ease,box-shadow .15s ease;margin:12px 0 16px}
.import-cta:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(107,46,68,.15)}
.import-cta-icon{font-size:34px;line-height:1;flex-shrink:0}
.import-cta-text{flex:1;line-height:1.4}
.import-cta-text strong{color:var(--dark);font-size:15px;display:block;margin-bottom:2px}
.import-cta-text span{color:var(--mid);font-size:12.5px}
.import-cta-arrow{font-size:22px;color:var(--mauve);flex-shrink:0}

/* === Recipe Action Buttons (Timer + Einkaufsliste im Rezept) === */
.recipe-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0 4px}
.recipe-action-btn{display:flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;padding:14px 16px;font-weight:800;font-size:13.5px;cursor:pointer;transition:transform .15s ease,box-shadow .15s ease;text-align:center;line-height:1.2}
.recipe-action-btn:active{transform:scale(.97)}
.recipe-action-timer{background:linear-gradient(135deg,var(--mauve),var(--dark));color:white;box-shadow:0 8px 18px rgba(107,46,68,.18)}
.recipe-action-shop{background:#FBF4EB;color:var(--dark);border:1.5px solid #DDB87A}

/* === Inline Step-Timer Chips === */
.step-timer{display:inline-flex;align-items:center;gap:4px;background:linear-gradient(135deg,var(--mauve),var(--dark));color:white;border:0;border-radius:999px;padding:3px 11px;font-size:12.5px;font-weight:800;cursor:pointer;vertical-align:baseline;margin:0 2px;white-space:nowrap;box-shadow:0 4px 10px rgba(107,46,68,.18);transition:transform .15s ease,box-shadow .15s ease;line-height:1.4}
.step-timer:active{transform:scale(.93)}
.step-timer:hover{box-shadow:0 6px 14px rgba(107,46,68,.28)}

/* === Navigation Improvements === */
.brand h1{cursor:pointer;transition:opacity .2s ease,transform .2s ease;display:inline-block}
.brand h1:hover{opacity:.75;transform:translateX(-2px)}
.tab.active{background:var(--bg);color:var(--dark);font-weight:900;box-shadow:inset 0 -3px 0 var(--dark)}
.tab:hover:not(.active){background:rgba(255,255,255,.12);color:white}
.back-bar{display:inline-flex;align-items:center;gap:8px;background:white;border:1.5px solid var(--border);border-radius:999px;padding:9px 18px;font-size:13px;font-weight:800;color:var(--dark);cursor:pointer;margin:18px 0 4px;transition:all .15s ease;text-decoration:none;user-select:none}
.back-bar:hover{background:var(--xl);border-color:var(--mauve);transform:translateX(-3px);box-shadow:0 6px 14px rgba(107,46,68,.18)}
.back-bar-arrow{font-size:18px;line-height:1}

/* === Toast === */
.smk-toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(40px);background:linear-gradient(135deg,var(--dark),var(--mauve));color:white;padding:14px 22px;border-radius:999px;font-weight:700;font-size:14px;box-shadow:0 18px 40px rgba(107,46,68,.28);opacity:0;transition:opacity .25s ease,transform .25s ease;z-index:9999;max-width:90vw;text-align:center;line-height:1.35}
.smk-toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* === Empty State (Einkaufsliste) === */
.empty-state{text-align:center;padding:30px 20px;color:var(--mid)}
.empty-state-icon{font-size:48px;margin-bottom:12px;opacity:.6}
.empty-state h4{font-family:Cormorant Garamond,serif;font-size:24px;margin:0 0 6px;color:var(--dark);font-weight:600}
.empty-state p{margin:0;font-size:13.5px;line-height:1.5}

</style>
</head>
<body>
<div class="app">
<header class="header"><div class="head-inner"><div class="brand"><div><h1 onclick="showTab('home')" title="Zur Startseite">Stoneware App</h1></div><button class="btn secondary" onclick="showTab('finder')">Produktfinder</button></div><nav class="tabs" id="tabs"></nav></div></header>
<main id="content"></main></div><div id="modalRoot"></div>
<script>
const products = [{"id": "home", "label": "Start", "emoji": "🏠"}, {"id": "all", "label": "Alle Rezepte", "emoji": "🍳"}, {"id": "ofenmeister", "label": "Ofenmeister", "emoji": "🏺", "desc": "Brot, One Pot, Schmorgerichte, Aufläufe und große Familienportionen."}, {"id": "lilly", "label": "Lilly", "emoji": "🫙", "desc": "Kleine Brote, Beilagen, Kuchen und kleine Portionen – auch für den kleinen Zaubermeister (1,2 L)."}, {"id": "ofenhexe", "label": "Ofenhexe", "emoji": "🥘", "desc": "Aufläufe, Ofengerichte, Familienessen und Feierabendbleche."}, {"id": "ofenhexe-rund", "label": "Runde Ofenhexe", "emoji": "🥧", "desc": "Die runde Form (26 cm, 3 L): Aufläufe, All-in-One-Gerichte und klassische Springform-Kuchen – herzhaft & süß."}, {"id": "ofenzauberer", "label": "James", "emoji": "🍕", "desc": "Pizza, Flammkuchen, Focaccia, Ofengemüse – dazu Kuchenliebe (Backrahmen-Kuchen) und Alles vom Stein."}, {"id": "zauberstein", "label": "Zauberstein", "emoji": "🪨", "desc": "Pizza, Brot, Brötchen, Fladenbrot und knusprige Snacks."}, {"id": "white-lady", "label": "White Lady", "emoji": "🍪", "desc": "Kuchen, Brownies, Zimtschnecken, Cookies und süße Blechideen."}, {"id": "shopping", "label": "Einkaufsliste", "emoji": "🧾"}, {"id": "tools", "label": "Tools", "emoji": "🧮"}, {"id": "finder", "label": "Finder", "emoji": "🛒"}];
const recipes = [{"id":101,"product":"ofenmeister","title":"Sauerteig-Mischbrot im Ofenmeister","category":"Brot","time":"55–60 Min","temp":"250°C → 220°C","portions":"1 Brot","ingredients":["350 g Weizenmehl 550","150 g Roggenmehl 1150","350 g Wasser","100 g aktiver Sauerteigstarter","10 g Salz","optional 1 TL Honig"],"steps":["Mehl, Wasser und Starter grob mischen und 30 Minuten ruhen lassen.","Salz einkneten und den Teig während der Stockgare 3–4x dehnen und falten.","Bis zur passenden Volumenzunahme reifen lassen.","Formen, Stückgare machen und einschneiden.","Im Ofenmeister mit Deckel backen, am Ende ohne Deckel bräunen."]},{"id":102,"product":"ofenmeister","title":"Anfänger-Bauernbrot","category":"Brot","time":"60 Min","temp":"230°C","portions":"1 Brot","ingredients":["350 g Weizenmehl 550","150 g Roggenmehl 1150","350 g Wasser","10 g frische Hefe","10 g Salz","1 TL Honig"],"steps":["Hefe und Honig im Wasser lösen.","Mehl und Salz zugeben und zu einem glatten Teig kneten.","60–90 Minuten ruhen lassen.","Teig falten, rund oder länglich formen und in den Ofenmeister geben.","Mit Deckel backen und anschließend auf einem Gitter auskühlen lassen."]},{"id":103,"product":"ofenmeister","title":"Käse-Jalapeño-Brot","category":"Brot","time":"55–60 Min","temp":"230°C","portions":"1 Brot","ingredients":["500 g Weizenmehl 550","340 g Wasser","100 g Sauerteigstarter oder 10 g Hefe","10 g Salz","120 g geriebener Käse","Jalapeños nach Geschmack"],"steps":["Grundteig herstellen und ruhen lassen.","Käse und Jalapeños beim letzten Falten einarbeiten.","Teig formen und in den Ofenmeister geben.","Mit Deckel backen, am Ende ohne Deckel bräunen."]},{"id":104,"product":"ofenmeister","title":"Mediterranes Hähnchen mit Kartoffeln","category":"Geflügel","time":"75 Min","temp":"220°C","portions":"4","ingredients":["800 g Hähnchenteile","700 g Kartoffeln in Spalten","1 Paprika","1 rote Zwiebel","2 Knoblauchzehen","3 EL Olivenöl","1 TL Paprika edelsüß","1 TL Oregano","100 ml Gemüsebrühe","Salz und Pfeffer"],"steps":["Kartoffeln, Gemüse, Öl und Gewürze im Ofenmeister mischen.","Hähnchen würzen und oben auflegen.","Mit Deckel 60 Minuten garen.","Deckel abnehmen und 10–15 Minuten bräunen."]},{"id":105,"product":"ofenmeister","title":"Putengeschnetzeltes in Champignon-Rahmsauce","category":"Geflügel","time":"50–60 Min","temp":"220°C","portions":"4","ingredients":["650 g Putengeschnetzeltes","250 g Champignons","1 Zwiebel","250 ml Sahne","250 ml Gemüsebrühe","1 TL Senf","1 TL Paprika edelsüß","Salz und Pfeffer","1 EL Speisestärke optional"],"steps":["Zwiebel und Champignons in den gefetteten Ofenmeister geben.","Pute würzen und darauf verteilen.","Sahne, Brühe, Senf und Gewürze verrühren und darüber geben.","Mit Deckel garen, zum Andicken optional Stärke einrühren und kurz ohne Deckel nachziehen lassen."]},{"id":106,"product":"ofenmeister","title":"Gyros-Reis-Topf","category":"One Pot","time":"65 Min","temp":"220°C","portions":"4","ingredients":["600 g Gyrosfleisch","250 g Reis","500 ml Gemüsebrühe","200 ml Sahne oder Kochsahne","1 Paprika","1 Zwiebel","150 g Mais optional","100 g Feta optional"],"steps":["Reis, Gemüse und Mais in den Ofenmeister geben.","Brühe und Sahne darüber gießen.","Gyrosfleisch oben verteilen.","Mit Deckel garen, vorsichtig umrühren und optional Feta darüber geben."]},{"id":107,"product":"ofenmeister","title":"Cremige Tortellini One Pot","category":"One Pot","time":"40–45 Min","temp":"210°C","portions":"4","ingredients":["500 g frische Tortellini","300 ml Sahne","250 ml Gemüsebrühe","150 g Frischkäse","200 g Kirschtomaten","150 g Spinat","80 g Parmesan","Salz, Pfeffer, Muskat"],"steps":["Tortellini, Spinat und Tomaten in den Ofenmeister geben.","Sahne, Brühe, Frischkäse und Gewürze verrühren.","Sauce darüber geben und mit Deckel garen.","Parmesan darüber streuen und kurz ohne Deckel überbacken."]},{"id":108,"product":"ofenmeister","title":"Hackbällchen Toscana","category":"Fleisch","time":"50 Min","temp":"220°C","portions":"4","ingredients":["600 g Hackfleisch","1 Ei","3 EL Semmelbrösel","1 TL Senf","500 ml passierte Tomaten","150 ml Sahne","1 TL italienische Kräuter","125 g Mozzarella","Salz, Pfeffer, Paprika"],"steps":["Hackfleisch mit Ei, Semmelbröseln, Senf und Gewürzen verkneten.","Bällchen formen und in den Ofenmeister legen.","Tomaten, Sahne und Kräuter verrühren und darüber geben.","Mit Deckel garen, Mozzarella darauf geben und ohne Deckel bräunen."]},{"id":109,"product":"ofenmeister","title":"Lasagne Familienportion","category":"Auflauf","time":"60 Min","temp":"200°C","portions":"4–6","ingredients":["9–12 Lasagneplatten","700 g Bolognese","400 ml Béchamel oder Sahnesauce","150 g geriebener Käse","optional Gemüsewürfel"],"steps":["Etwas Sauce auf den Boden geben.","Lasagneplatten, Bolognese und Béchamel abwechselnd schichten.","Mit Sauce und Käse abschließen.","Mit Deckel backen, am Ende ohne Deckel goldbraun überbacken."]},{"id":110,"product":"ofenmeister","title":"Kartoffelgratin mit Schinken","category":"Auflauf","time":"70 Min","temp":"200°C","portions":"4","ingredients":["900 g Kartoffeln in dünnen Scheiben","200 g Kochschinken","300 ml Sahne","200 ml Milch","1 Knoblauchzehe","120 g Käse","Salz, Pfeffer, Muskat"],"steps":["Kartoffeln und Schinken in den Ofenmeister schichten.","Sahne, Milch, Knoblauch und Gewürze verrühren.","Sauce darüber geben und mit Deckel garen.","Käse darüber streuen und ohne Deckel bräunen."]},{"id":111,"product":"ofenmeister","title":"Chili sin Carne","category":"Eintopf","time":"55 Min","temp":"220°C","portions":"4","ingredients":["1 Dose Kidneybohnen","1 Dose schwarze Bohnen","1 Dose Mais","700 ml passierte Tomaten","1 Paprika","1 Zwiebel","1 TL Kreuzkümmel","1 TL Paprika geräuchert","Chili nach Geschmack"],"steps":["Alle Zutaten im Ofenmeister gut verrühren.","Mit Deckel garen.","Abschmecken und optional ohne Deckel etwas einkochen lassen.","Mit Reis, Brot oder Tortilla-Chips servieren."]},{"id":112,"product":"ofenmeister","title":"Kürbis-Kokos-Curry","category":"Eintopf","time":"50–55 Min","temp":"220°C","portions":"4","ingredients":["700 g Hokkaido","1 Dose Kokosmilch","300 ml Gemüsebrühe","1 Dose Kichererbsen","1 Zwiebel","1–2 EL Currypaste","1 TL Kurkuma","Salz und Pfeffer","optional Spinat"],"steps":["Kürbis, Kichererbsen und Zwiebel in den Ofenmeister geben.","Kokosmilch, Brühe und Gewürze verrühren.","Mit Deckel garen.","Optional Spinat unterheben und kurz nachziehen lassen."]},{"id":201,"product":"lilly","title":"Mini-Bauernbrot aus der Lilly","category":"Brot","time":"50–55 Min","temp":"230°C","portions":"1 kleines Brot","ingredients":["250 g Weizenmehl 550","100 g Roggenmehl 1150","230 g Wasser","8 g frische Hefe","1 TL Honig","8 g Salz"],"steps":["Hefe und Honig im Wasser lösen.","Mehl und Salz zugeben und kneten.","60–90 Minuten ruhen lassen.","Formen, in die Lilly legen und mit Deckel backen."]},{"id":202,"product":"lilly","title":"Ayran-Dinkelbrot","category":"Brot","time":"60 Min","temp":"230°C","portions":"1 kleines Brot","ingredients":["400 g Ayran","20 g Hefe","1 TL Honig","300 g Dinkelmehl 630","150 g Roggenmehl 1150","70 g Haferflocken","1,5 TL Salz"],"steps":["Ayran, Hefe und Honig verrühren.","Restliche Zutaten zugeben und kneten.","1 Stunde ruhen lassen.","Falten, in die Lilly legen und backen."]},{"id":203,"product":"lilly","title":"Bananenbrot","category":"Kuchen","time":"45–50 Min","temp":"180°C","portions":"1 kleiner Kuchen","ingredients":["2 reife Bananen","2 Eier","80 g Zucker","80 ml Öl","150 g Mehl","1 TL Backpulver","1 Prise Salz","optional Schokostücke"],"steps":["Bananen zerdrücken.","Eier, Zucker und Öl unterrühren.","Trockene Zutaten kurz einrühren.","In die gefettete Lilly geben und backen."]},{"id":204,"product":"lilly","title":"Mini-Nudelauflauf","category":"Auflauf","time":"30–35 Min","temp":"200°C","portions":"2","ingredients":["250 g gekochte Nudeln","200 ml Sahnesauce","100 g Käse","Gemüse nach Wahl","Salz und Pfeffer"],"steps":["Alles in der Lilly vermengen.","Käse darüber streuen.","Mit Deckel backen und am Ende kurz bräunen."]},{"id":205,"product":"lilly","title":"Rosmarin-Kartoffeln","category":"Beilage","time":"45–50 Min","temp":"220°C","portions":"2–3","ingredients":["600 g kleine Kartoffeln","2 EL Olivenöl","1 TL Rosmarin","1 Knoblauchzehe","Salz und Pfeffer","optional Parmesan"],"steps":["Kartoffeln halbieren und würzen.","In die Lilly geben.","Mit Deckel garen.","Ohne Deckel bräunen und optional Parmesan darüber geben."]},{"id":206,"product":"lilly","title":"Milchreis aus der Lilly","category":"Süßes","time":"55–60 Min","temp":"180°C","portions":"2–3","ingredients":["150 g Milchreis","600 ml Milch","30 g Zucker","1 Pck. Vanillezucker","1 Prise Salz","Zimt zum Servieren"],"steps":["Alle Zutaten in die Lilly geben und gut verrühren.","Mit Deckel garen.","Umrühren und kurz nachziehen lassen.","Mit Zimt oder Beeren servieren."]},{"id":207,"product":"lilly","title":"Bratäpfel","category":"Süßes","time":"35 Min","temp":"190°C","portions":"2–3","ingredients":["3 Äpfel","3 TL Mandelmus oder Butter","3 TL Nüsse","2 TL Honig","1/2 TL Zimt","optional Rosinen"],"steps":["Äpfel entkernen und in die Lilly setzen.","Füllung mischen und einfüllen.","Mit Deckel backen, am Ende kurz ohne Deckel fertig garen."]},{"id":208,"product":"lilly","title":"Mini-Gnocchi-Tomate-Mozzarella","category":"One Pot","time":"30–35 Min","temp":"210°C","portions":"2","ingredients":["400 g Gnocchi","300 ml passierte Tomaten","100 ml Sahne","1 Kugel Mozzarella","Tomaten","Basilikum","Salz und Pfeffer"],"steps":["Gnocchi und Sauce in die Lilly geben.","Mozzarella darüber zupfen.","Mit Deckel garen und am Ende ohne Deckel überbacken."]},{"id":301,"product":"ofenhexe","title":"Feierabendblech mit Hähnchenschenkeln","category":"Ofengericht","time":"45–50 Min","temp":"220°C","portions":"4","ingredients":["6 Hähnchenschenkel","800 g Kartoffeln","Karotten","Zwiebeln","Knoblauch","3 EL Olivenöl","italienische Gewürze","Salz und Pfeffer"],"steps":["Gemüse schneiden und würzen.","Hähnchen würzen und auflegen.","In der Ofenhexe backen, bis das Hähnchen gar und knusprig ist."]},{"id":302,"product":"ofenhexe","title":"Gemüse-Hack-Auflauf","category":"Auflauf","time":"45 Min","temp":"210°C","portions":"4","ingredients":["400 g Hackfleisch","Kartoffeln oder Nudeln","Paprika","Karotten","250 ml Sahne","200 ml Brühe","Käse","Gewürze"],"steps":["Alle Zutaten in der Ofenhexe verteilen.","Sauce darüber geben.","Mit Käse bestreuen und backen."]},{"id":303,"product":"ofenhexe","title":"Maultaschen-Auflauf","category":"Auflauf","time":"35–40 Min","temp":"200°C","portions":"4","ingredients":["800 g Maultaschen","250 ml Sahne","200 ml Gemüsebrühe","1 Zwiebel","Spinat oder Gemüse","120 g Käse","Muskat, Salz, Pfeffer"],"steps":["Maultaschen schneiden und in die Ofenhexe geben.","Sauce und Gemüse darüber verteilen.","Mit Käse backen, bis alles goldbraun ist."]},{"id":304,"product":"ofenhexe","title":"XXL Schnitzelauflauf","category":"Fleisch","time":"45 Min","temp":"210°C","portions":"4","ingredients":["4 Schnitzel","Kartoffelspalten","200 ml Sahne","200 ml Brühe","Paprika","Käse","Gewürze"],"steps":["Kartoffeln unten verteilen.","Schnitzel würzen und auflegen.","Sauce darüber geben und backen.","Käse am Ende optional darüber streuen."]},{"id":305,"product":"ofenhexe","title":"Brokkoli-Hähnchen-Auflauf","category":"Auflauf","time":"45 Min","temp":"200°C","portions":"4","ingredients":["600 g Hähnchenbrust","500 g Brokkoli","250 ml Sahne","200 ml Brühe","100 g Frischkäse","Käse","Salz, Pfeffer, Muskat"],"steps":["Hähnchen und Brokkoli in der Ofenhexe verteilen.","Sauce verrühren und darüber geben.","Mit Käse backen, bis alles gar ist."]},{"id":401,"product":"ofenzauberer","title":"Pizza Margherita","category":"Pizza","time":"12–18 Min","temp":"230°C","portions":"1 Blech","ingredients":["1 Pizzateig","Tomatensauce","Mozzarella","Basilikum","Olivenöl","Salz"],"steps":["Teig ausrollen und auf den James legen.","Mit Sauce und Mozzarella belegen.","Knusprig backen und mit Basilikum servieren."]},{"id":402,"product":"ofenzauberer","title":"Flammkuchen Elsässer Art","category":"Pizza","time":"12–15 Min","temp":"230°C","portions":"1 Blech","ingredients":["Flammkuchenteig","Crème fraîche","Zwiebeln","Speckwürfel","Pfeffer"],"steps":["Teig dünn ausrollen.","Mit Crème fraîche bestreichen und belegen.","Knusprig backen."]},{"id":403,"product":"ofenzauberer","title":"Pizzabrötchen Party Style","category":"Snack","time":"18–22 Min","temp":"220°C","portions":"12 Stück","ingredients":["Brötchenteig","Tomatensauce","Salami oder Gemüse","Mozzarella","italienische Kräuter"],"steps":["Teig portionieren und füllen.","Auf dem James verteilen.","Backen, bis die Brötchen goldbraun sind."]},{"id":404,"product":"ofenzauberer","title":"Ofengemüse mit Feta","category":"Vegetarisch","time":"30–35 Min","temp":"220°C","portions":"4","ingredients":["Kartoffeln","Zucchini","Paprika","Karotten","Olivenöl","Feta","Kräuter","Salz und Pfeffer"],"steps":["Gemüse schneiden und würzen.","Auf dem James verteilen.","Backen und Feta am Ende darüber geben."]},{"id":405,"product":"ofenzauberer","title":"Focaccia vom James","category":"Brot","time":"25–30 Min","temp":"220°C","portions":"1 Blech","ingredients":["500 g Mehl","380 g Wasser","10 g Hefe","10 g Salz","Olivenöl","Rosmarin","grobes Salz"],"steps":["Teig herstellen und gut gehen lassen.","Auf dem James verteilen und mit Öl beträufeln.","Mit Fingern Mulden drücken, Rosmarin und Salz darüber geben.","Goldbraun backen."]},{"id":501,"product":"zauberstein","title":"Knusprige Sonntagsbrötchen","category":"Brot","time":"20–25 Min","temp":"230°C","portions":"8 Stück","ingredients":["500 g Mehl","300 g Wasser","10 g Hefe","10 g Salz","1 TL Honig"],"steps":["Teig kneten und gehen lassen.","Brötchen formen und einschneiden.","Auf dem Zauberstein knusprig backen."]},{"id":502,"product":"zauberstein","title":"Knusper-Fladenbrot","category":"Brot","time":"18–22 Min","temp":"230°C","portions":"1 Fladen","ingredients":["400 g Mehl","250 g Wasser","8 g Hefe","8 g Salz","Olivenöl","Sesam"],"steps":["Teig kneten und gehen lassen.","Flach drücken, mit Öl bestreichen und Sesam bestreuen.","Knusprig backen."]},{"id":503,"product":"zauberstein","title":"Pizza Bianca","category":"Pizza","time":"12–16 Min","temp":"230°C","portions":"1 Pizza","ingredients":["Pizzateig","Ricotta oder Schmand","Mozzarella","Rosmarin","Olivenöl","Salz"],"steps":["Teig ausziehen.","Mit Ricotta, Mozzarella und Rosmarin belegen.","Auf dem Zauberstein knusprig backen."]},{"id":504,"product":"zauberstein","title":"Schnelle Knoblauch-Stangen","category":"Snack","time":"14–18 Min","temp":"220°C","portions":"8 Stück","ingredients":["Pizzateig","Knoblauchbutter","Parmesan","Petersilie"],"steps":["Teig in Streifen schneiden.","Mit Knoblauchbutter bestreichen.","Auf dem Zauberstein backen und mit Parmesan bestreuen."]},{"id":601,"product":"white-lady","title":"Zimtschnecken vom Stein","category":"Süßes","time":"25–30 Min","temp":"180°C","portions":"12 Stück","ingredients":["Hefeteig","80 g Butter","80 g Zucker","2 TL Zimt","Frischkäseglasur optional"],"steps":["Teig ausrollen und mit Butter, Zucker und Zimt füllen.","Aufrollen, schneiden und auf die White Lady legen.","Goldbraun backen und optional glasieren."]},{"id":602,"product":"white-lady","title":"Saftige Brownies","category":"Kuchen","time":"25–30 Min","temp":"180°C","portions":"1 Blech","ingredients":["200 g Schokolade","150 g Butter","150 g Zucker","3 Eier","100 g Mehl","30 g Kakao"],"steps":["Schokolade und Butter schmelzen.","Zucker und Eier einrühren.","Mehl und Kakao kurz unterheben.","Auf der White Lady backen, nicht zu trocken werden lassen."]},{"id":603,"product":"white-lady","title":"Apfel-Streusel-Kuchen","category":"Kuchen","time":"35–40 Min","temp":"180°C","portions":"1 Blech","ingredients":["Rührteig","4 Äpfel","Zimt","Streusel aus Butter, Zucker und Mehl"],"steps":["Teig auf der White Lady verteilen.","Äpfel darauf geben.","Streusel darüber st
